<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI 产品经理工作台：用六个核心模块快速完成可评审、可开发、可验收的 PRD。">
  <meta name="theme-color" content="#111310">
  <title>AI PM 工作台 · PRD 制作</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root[data-theme="dark"] {
      --color-bg: #111310;
      --color-sidebar: #171916;
      --color-surface: #1d201c;
      --color-surface-strong: #252923;
      --color-input: #151714;
      --color-text: #f2f3ec;
      --color-text-muted: #9da296;
      --color-accent: #b8ed65;
      --color-accent-ink: #17200b;
      --color-secondary: #ff936f;
      --color-border: #343930;
      --color-border-strong: #4b5246;
      --color-danger: #ff7c75;
      --color-success: #8bd450;
      --color-overlay: rgba(4, 5, 4, 0.72);
      --shadow-menu: 0 16px 48px rgba(0, 0, 0, 0.38);
    }

    :root[data-theme="light"] {
      --color-bg: #f5f5ef;
      --color-sidebar: #eceee7;
      --color-surface: #ffffff;
      --color-surface-strong: #e7eadf;
      --color-input: #fbfcf8;
      --color-text: #1c211b;
      --color-text-muted: #62695f;
      --color-accent: #5f861d;
      --color-accent-ink: #ffffff;
      --color-secondary: #c84e2d;
      --color-border: #d1d6ca;
      --color-border-strong: #aeb6a5;
      --color-danger: #bc3832;
      --color-success: #4e7b20;
      --color-overlay: rgba(27, 31, 25, 0.46);
      --shadow-menu: 0 16px 48px rgba(30, 35, 28, 0.16);
    }

    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; }
    html { color-scheme: dark; }
    html[data-theme="light"] { color-scheme: light; }
    body {
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: "Noto Sans SC", sans-serif;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      transition: background 180ms ease, color 180ms ease;
    }
    button, input, textarea { font: inherit; letter-spacing: 0; }
    button { color: inherit; }
    button, a, input, textarea { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }
    button:disabled { cursor: not-allowed; opacity: 0.42; }
    ::selection { background: var(--color-accent); color: var(--color-accent-ink); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--color-border-strong); border-radius: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .app-shell {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      height: 100vh;
      border-right: 1px solid var(--color-border);
      background: var(--color-sidebar);
      overflow: hidden;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 64px;
      padding: 0 18px;
      border-bottom: 1px solid var(--color-border);
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: var(--color-text);
      color: var(--color-bg);
    }
    .brand-name {
      font-family: "Manrope", "Noto Sans SC", sans-serif;
      font-size: 14px;
      font-weight: 700;
    }
    .brand-version {
      color: var(--color-text-muted);
      font-size: 10px;
      font-weight: 600;
    }
    .workflow { flex: 0 0 auto; padding: 18px 10px 12px; }
    .nav-label {
      padding: 0 9px 8px;
      color: var(--color-text-muted);
      font-size: 11px;
      font-weight: 600;
    }
    .workflow-list { display: grid; gap: 4px; list-style: none; padding: 0; }
    .workflow-item {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      width: 100%;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .workflow-item:hover:not(:disabled) { background: var(--color-surface); }
    .workflow-item.active {
      border-color: var(--color-border);
      background: var(--color-surface-strong);
    }
    .workflow-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      color: var(--color-text-muted);
    }
    .workflow-item.active .workflow-icon { color: var(--color-accent); }
    .workflow-name { display: block; font-size: 13px; font-weight: 600; }
    .workflow-desc { display: block; margin-top: 2px; color: var(--color-text-muted); font-size: 10px; }
    .step-number { color: var(--color-text-muted); font-family: "Manrope", sans-serif; font-size: 10px; }
    .soon-tag {
      padding: 2px 5px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      color: var(--color-text-muted);
      font-size: 9px;
    }
    .prd-library {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      border-top: 1px solid var(--color-border);
    }
    .library-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 44px;
      padding: 0 10px 0 19px;
    }
    .library-title { color: var(--color-text-muted); font-size: 11px; font-weight: 600; }
    .library-actions, .tree-actions { display: flex; align-items: center; gap: 2px; }
    .tree-icon-button {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
    }
    .tree-icon-button:hover { background: var(--color-surface-strong); color: var(--color-text); }
    .tree-icon-button.danger:hover { color: var(--color-danger); }
    .tree-icon-button .lucide { width: 14px; height: 14px; }
    .prd-tree { flex: 1; min-height: 0; padding: 0 8px 12px; overflow-y: auto; }
    .tree-folder { margin-bottom: 2px; }
    .tree-row {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      min-height: 34px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--color-text-muted);
    }
    .tree-row:hover { background: var(--color-surface); color: var(--color-text); }
    .tree-row.active { border-color: var(--color-border); background: var(--color-surface-strong); color: var(--color-text); }
    .tree-main {
      display: flex;
      flex: 1;
      min-width: 0;
      align-items: center;
      gap: 7px;
      height: 32px;
      padding: 0 5px 0 7px;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .tree-main .lucide { width: 14px; height: 14px; flex: 0 0 auto; }
    .tree-name { min-width: 0; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .tree-actions { display: none; padding-right: 3px; }
    .tree-row:hover .tree-actions, .tree-row:focus-within .tree-actions { display: flex; }
    .tree-actions .tree-icon-button { width: 25px; height: 25px; }
    .tree-files { padding-left: 17px; }
    .tree-folder.collapsed .tree-files { display: none; }
    .tree-empty { padding: 8px 10px 10px 29px; color: var(--color-text-muted); font-size: 10px; }
    .tree-root-label { padding: 9px 8px 4px; color: var(--color-text-muted); font-size: 9px; font-weight: 700; }
    .sidebar-footer {
      padding: 12px 14px 16px;
      border-top: 1px solid var(--color-border);
    }
    .progress-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--color-text-muted); font-size: 11px; }
    .progress-track { height: 4px; margin-top: 9px; overflow: hidden; border-radius: 4px; background: var(--color-border); }
    .progress-fill { width: 0; height: 100%; background: var(--color-accent); transition: width 220ms ease; }

    .workspace { display: grid; grid-template-rows: 64px minmax(0, 1fr); min-width: 0; height: 100vh; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
      padding: 0 18px 0 22px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg);
    }
    .project-block { display: flex; align-items: center; min-width: 0; gap: 12px; }
    .icon-button.mobile-menu { display: none; }
    .title-wrap { min-width: 0; }
    .project-title {
      display: block;
      width: min(360px, 46vw);
      padding: 3px 0;
      color: var(--color-text);
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .save-state { margin-top: 2px; color: var(--color-text-muted); font-size: 10px; }
    .toolbar { display: flex; align-items: center; gap: 7px; }
    .icon-button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 36px;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      background: var(--color-surface);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }
    .icon-button { width: 36px; padding: 0; }
    .button { padding: 0 12px; font-size: 12px; font-weight: 600; }
    .icon-button:hover, .button:hover { border-color: var(--color-border-strong); background: var(--color-surface-strong); }
    .icon-button:active, .button:active { transform: translateY(1px); }
    .button.primary { border-color: var(--color-accent); background: var(--color-accent); color: var(--color-accent-ink); }
    .button.primary:hover { filter: brightness(0.95); }
    .button.danger { color: var(--color-danger); }
    .lucide { width: 16px; height: 16px; stroke-width: 1.8; }

    .mobile-tabs { display: none; }
    .work-area { display: grid; grid-template-columns: minmax(500px, 1.08fr) minmax(390px, 0.92fr); min-height: 0; }
    .editor-pane, .preview-pane { min-width: 0; min-height: 0; overflow-x: hidden; overflow-y: auto; }
    .editor-pane { border-right: 1px solid var(--color-border); }
    .pane-inner { width: min(100%, 780px); margin: 0 auto; padding: 28px 30px 60px; }
    .pane-kicker { color: var(--color-accent); font-size: 11px; font-weight: 700; }
    .pane-heading { margin-top: 6px; font-size: 23px; line-height: 1.3; }
    .pane-lead { max-width: 620px; margin-top: 8px; color: var(--color-text-muted); font-size: 12px; line-height: 1.7; }
    .editor-pane.markdown-mode { overflow: hidden; }
    .markdown-workspace, .markdown-workspace.chat-collapsed { display: grid; grid-template-rows: 48px minmax(0, 1fr); width: 100%; height: 100%; min-height: 0; }
    .markdown-editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
    }
    .markdown-file { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 11px; font-weight: 700; }
    .markdown-file .lucide { color: var(--color-accent); }
    .markdown-file span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .markdown-stats { color: var(--color-text-muted); font-size: 10px; }
    .markdown-editor-meta { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .markdown-editor-actions { display: flex; align-items: center; gap: 3px; }
    .markdown-editor-actions .icon-button { width: 30px; height: 30px; background: transparent; }
    .markdown-editor-wrap { min-width: 0; min-height: 0; padding: 18px; background: var(--color-bg); }
    .markdown-editor {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 16px 17px;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      background: var(--color-input);
      color: var(--color-text);
      font-family: "Noto Sans SC", sans-serif;
      font-size: 13px;
      line-height: 1.8;
      tab-size: 2;
      resize: none;
      white-space: pre-wrap;
      overflow-wrap: normal;
      transition: border-color 160ms ease, background 160ms ease;
    }
    .markdown-editor:hover { border-color: var(--color-border-strong); }
    .markdown-editor:focus { border-color: var(--color-accent); outline: 0; background: var(--color-surface); }
    .ai-chat {
      display: none;
      grid-template-rows: 44px minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      border-top: 1px solid var(--color-border-strong);
      background: var(--color-surface);
    }
    .ai-chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 14px 0 18px;
      border-bottom: 1px solid var(--color-border);
    }
    .ai-chat-title { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; }
    .ai-chat-title .lucide { color: var(--color-accent); }
    .ai-chat-actions { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .chat-toggle { width: 32px; height: 32px; background: transparent; }
    .chat-undo { width: 32px; height: 32px; background: transparent; }
    .chat-undo:disabled { opacity: 0.35; cursor: not-allowed; }
    #chatModelStatusText { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-toggle .chat-collapse-icon { display: inline; }
    .chat-toggle .chat-expand-icon { display: none; }
    .chat-collapsed .chat-toggle .chat-collapse-icon { display: none; }
    .chat-collapsed .chat-toggle .chat-expand-icon { display: inline; }
    .chat-collapsed .ai-chat { grid-template-rows: 44px; }
    .chat-collapsed .ai-chat-messages, .chat-collapsed .ai-chat-form { display: none; }
    .ai-chat-messages { display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: 12px 18px; overflow-y: auto; }
    .ai-message {
      width: fit-content;
      max-width: 88%;
      padding: 8px 10px;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      color: var(--color-text-muted);
      font-size: 11px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .ai-message.user { align-self: flex-end; border-color: var(--color-border-strong); background: var(--color-input); color: var(--color-text); }
    .ai-message.assistant { align-self: flex-start; }
    .ai-message.error { border-color: var(--color-danger); color: var(--color-danger); }
    .ai-chat-form { display: grid; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--color-border); }
    .chat-prompt {
      width: 100%;
      height: 70px;
      padding: 9px 42px 9px 10px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: var(--color-input);
      color: var(--color-text);
      font-size: 11px;
      line-height: 1.55;
      resize: none;
    }
    .chat-prompt:focus { border-color: var(--color-accent); outline: 0; background: var(--color-surface); }
    .chat-prompt::placeholder { color: var(--color-text-muted); opacity: 0.7; }
    .chat-composer { position: relative; }
    .chat-submit {
      position: absolute;
      right: 6px;
      bottom: 7px;
      width: 32px;
      height: 32px;
      border: 1px solid var(--color-accent);
      border-radius: 6px;
      background: var(--color-accent);
      color: var(--color-accent-ink);
      cursor: pointer;
    }
    .chat-submit:disabled { cursor: wait; opacity: 0.65; }
    .chat-submit .chat-loader { display: none; }
    .chat-submit.loading .chat-send-icon { display: none; }
    .chat-submit.loading .chat-loader { display: inline; animation: spin 900ms linear infinite; }
    .chat-error { display: none; color: var(--color-danger); font-size: 10px; }
    .chat-error.show { display: block; }

    .meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
    .form-section { padding: 25px 0; border-bottom: 1px solid var(--color-border); scroll-margin-top: 16px; }
    .section-head { display: grid; grid-template-columns: 34px 1fr auto; align-items: start; gap: 10px; margin-bottom: 17px; }
    .section-number {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid var(--color-border-strong);
      border-radius: 6px;
      color: var(--color-text-muted);
      font-family: "Manrope", sans-serif;
      font-size: 11px;
      font-weight: 700;
    }
    .section-title { font-size: 15px; line-height: 1.3; }
    .section-note { margin-top: 3px; color: var(--color-text-muted); font-size: 11px; line-height: 1.5; }
    .complete-dot { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--color-border-strong); transition: background 160ms ease; }
    .form-section.complete .complete-dot { background: var(--color-success); }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: grid; gap: 7px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .field-label { color: var(--color-text-muted); font-size: 11px; font-weight: 600; }
    .field-label .required { color: var(--color-secondary); }
    .text-input, .text-area {
      width: 100%;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      background: var(--color-input);
      color: var(--color-text);
      transition: border-color 160ms ease, background 160ms ease;
    }
    .text-input { height: 40px; padding: 0 11px; }
    .text-area { min-height: 86px; padding: 10px 11px; line-height: 1.65; resize: vertical; }
    .text-input:hover, .text-area:hover { border-color: var(--color-border-strong); }
    .text-input:focus, .text-area:focus { border-color: var(--color-accent); outline: 0; background: var(--color-surface); }
    .text-input::placeholder, .text-area::placeholder { color: var(--color-text-muted); opacity: 0.7; }
    .hint { color: var(--color-text-muted); font-size: 10px; line-height: 1.5; }

    .event-table-wrap { width: 100%; max-width: 100%; min-width: 0; overflow-x: auto; border: 1px solid var(--color-border); border-radius: 7px; }
    .event-table { width: 100%; min-width: 620px; border-collapse: collapse; }
    .event-table th { padding: 9px 10px; background: var(--color-surface); color: var(--color-text-muted); font-size: 10px; text-align: left; }
    .event-table td { padding: 6px; border-top: 1px solid var(--color-border); }
    .event-table input { width: 100%; height: 34px; padding: 0 7px; border: 0; background: transparent; color: var(--color-text); font-size: 11px; }
    .event-table input:focus { outline: 1px solid var(--color-accent); border-radius: 4px; }

    .preview-pane { background: var(--color-surface); }
    .preview-sticky {
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 48px;
      padding: 0 24px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
    }
    .preview-label { display: flex; align-items: center; gap: 8px; color: var(--color-text-muted); font-size: 11px; font-weight: 600; }
    .preview-actions { display: flex; gap: 6px; }
    .preview-actions .icon-button { width: 32px; height: 32px; background: transparent; }
    .preview-fullscreen-button .minimize-icon { display: none; }
    .preview-pane.preview-fullscreen .preview-fullscreen-button .maximize-icon { display: none; }
    .preview-pane.preview-fullscreen .preview-fullscreen-button .minimize-icon { display: inline; }
    body.preview-fullscreen-open { overflow: hidden; }
    .preview-pane.preview-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: block;
      width: 100vw;
      max-width: 100vw;
      height: 100vh;
      overflow-y: auto;
      background: var(--color-surface);
    }
    .preview-pane.preview-fullscreen .preview-sticky { display: flex; }
    .preview-pane.preview-fullscreen .document { width: min(calc(100% - 40px), 920px); min-height: calc(100vh - 92px); }
    .document {
      width: min(calc(100% - 44px), 720px);
      min-height: calc(100vh - 112px);
      margin: 22px auto 44px;
      padding: 42px 44px 56px;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      background: var(--color-bg);
    }
    .doc-label { color: var(--color-secondary); font-size: 10px; font-weight: 700; }
    .doc-title { margin-top: 10px; font-size: 28px; line-height: 1.35; overflow-wrap: anywhere; }
    .doc-meta { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 13px; padding-bottom: 22px; border-bottom: 1px solid var(--color-border); color: var(--color-text-muted); font-size: 10px; }
    .doc-editable {
      border-radius: 3px;
      outline: 1px solid transparent;
      transition: color 140ms ease, background 140ms ease, outline-color 140ms ease;
      cursor: text;
    }
    .doc-editable:hover { outline-color: var(--color-border-strong); }
    .doc-editable:focus { outline-color: var(--color-accent); background: var(--color-input); color: var(--color-text); }
    .doc-title.doc-editable { padding: 2px 4px; margin-left: -4px; }
    .doc-value.doc-editable { display: inline; padding: 1px 3px; }
    .doc-meta .doc-editable { padding: 1px 3px; }
    .doc-section { padding-top: 24px; }

    .doc-list { display: grid; gap: 8px; margin-top: 12px; padding: 0; list-style: none; }
    .doc-list li { display: grid; grid-template-columns: 5px 1fr; gap: 9px; color: var(--color-text); font-size: 12px; line-height: 1.7; }
    .doc-list li::before { content: ""; width: 4px; height: 4px; margin-top: 8px; border-radius: 50%; background: var(--color-accent); }
    .doc-term { color: var(--color-text-muted); }
    .doc-empty { color: var(--color-text-muted); font-style: normal; }
    .doc-table { width: 100%; margin-top: 12px; border-collapse: collapse; font-size: 10px; }
    .doc-table th, .doc-table td { padding: 8px; border: 1px solid var(--color-border); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
    .doc-table th { color: var(--color-text-muted); font-weight: 600; }
    .doc-table td.doc-editable:focus { outline-offset: -2px; }
    .doc-source-line {
      border-radius: 3px;
      outline: 1px solid transparent;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      transition: background 140ms ease, outline-color 140ms ease;
      cursor: text;
    }
    .doc-source-line:hover { outline-color: var(--color-border-strong); }

    .doc-source-line:empty::before { content: attr(data-placeholder); color: var(--color-text-muted); }
    h1.doc-source-line { margin: 8px 0 18px; padding: 2px 4px; font-size: 28px; line-height: 1.35; }
    h2.doc-source-line { margin-top: 26px; padding: 2px 3px; font-size: 16px; line-height: 1.45; }
    h3.doc-source-line, h4.doc-source-line, h5.doc-source-line, h6.doc-source-line { margin-top: 20px; padding: 2px 3px; font-size: 13px; line-height: 1.5; }
    p.doc-source-line { margin-top: 9px; padding: 2px 3px; color: var(--color-text); font-size: 12px; line-height: 1.75; }
    .doc-source-spacer { height: 7px; }
    .doc-list-line { display: grid; grid-template-columns: 15px minmax(0, 1fr); gap: 5px; margin-top: 7px; font-size: 12px; line-height: 1.7; }
    .doc-list-marker { padding-top: 2px; color: var(--color-accent); font-size: 10px; text-align: center; }
    .doc-list-line .doc-source-line { padding: 1px 3px; }
    .doc-quote { margin-top: 10px; padding: 7px 10px; border-left: 2px solid var(--color-accent); color: var(--color-text-muted); font-size: 12px; line-height: 1.7; }
    .doc-code { margin-top: 12px; padding: 12px; overflow-x: auto; border: 1px solid var(--color-border); border-radius: 5px; background: var(--color-input); }
    .doc-code .doc-source-line { min-height: 20px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; line-height: 1.65; }
    .doc-divider { margin: 18px 0; border: 0; border-top: 1px solid var(--color-border); }
    .doc-table th.doc-source-line, .doc-table td.doc-source-line { min-width: 90px; outline-offset: -2px; cursor: text; }

    .menu {
      position: absolute;
      top: 53px;
      right: 18px;
      z-index: 20;
      display: none;
      width: 210px;
      padding: 6px;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      background: var(--color-surface);
      box-shadow: var(--shadow-menu);
    }
    .menu.open { display: grid; }
    .menu button {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      padding: 0 9px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      text-align: left;
      font-size: 12px;
      cursor: pointer;
    }
    .menu button:hover { background: var(--color-surface-strong); }
    .menu-divider { height: 1px; margin: 5px 3px; background: var(--color-border); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--color-overlay);
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(720px, 100%);
      max-height: min(760px, calc(100vh - 40px));
      overflow: hidden;
      border: 1px solid var(--color-border-strong);
      border-radius: 8px;
      background: var(--color-surface);
      box-shadow: var(--shadow-menu);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 58px;
      padding: 0 16px 0 20px;
      border-bottom: 1px solid var(--color-border);
    }
    .modal-title { font-size: 15px; }
    .modal-body { min-height: 0; padding: 18px 20px; overflow-y: auto; }
    .modal-note { margin-top: 9px; color: var(--color-text-muted); font-size: 10px; }
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-height: 62px;
      padding: 0 20px;
      border-top: 1px solid var(--color-border);
    }
    .modal.compact { width: min(620px, 100%); }
    .modal.library-modal { width: min(420px, 100%); }
    .dialog-description { color: var(--color-text-muted); font-size: 11px; line-height: 1.65; }
    .dialog-description:empty { display: none; }
    .dialog-field { display: grid; gap: 7px; margin-top: 14px; }
    .dialog-field.hidden { display: none; }
    .button.destructive { border-color: var(--color-danger); background: var(--color-danger); color: #fff; }
    .modal-field-stack { display: grid; gap: 15px; }
    .modal-list { display: grid; gap: 8px; }
    .modal-section + .modal-section { margin-top: 22px; }
    .modal-section-title { margin-bottom: 10px; color: var(--color-text-muted); font-size: 11px; font-weight: 700; }
    .template-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .template-item, .version-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      background: var(--color-input);
    }
    .template-copy, .version-copy { min-width: 0; }
    .template-name, .version-name { overflow: hidden; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .template-desc, .version-meta { margin-top: 4px; color: var(--color-text-muted); font-size: 10px; line-height: 1.5; }
    .template-actions, .version-actions { display: flex; flex: 0 0 auto; gap: 4px; }
    .template-actions .button, .version-actions .button { width: auto; height: 32px; padding: 0 9px; }
    .version-empty { padding: 28px 12px; color: var(--color-text-muted); font-size: 11px; text-align: center; }
    .select-input { appearance: auto; }
    .secret-field { position: relative; }
    .secret-field .text-input { padding-right: 44px; }
    .secret-toggle {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--color-text-muted);
      cursor: pointer;
    }
    .secret-toggle:hover { color: var(--color-text); background: var(--color-surface-strong); }
    .model-status-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: var(--color-input);
      color: var(--color-text-muted);
      font-size: 11px;
      cursor: pointer;
    }
    .model-status-button:hover { border-color: var(--color-border-strong); color: var(--color-text); }
    .model-status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-secondary); }
    .model-status-button.configured .model-status-dot { background: var(--color-success); }
    .generation-error {
      display: none;
      margin-top: 10px;
      padding: 9px 10px;
      border-left: 2px solid var(--color-danger);
      background: var(--color-input);
      color: var(--color-danger);
      font-size: 11px;
      line-height: 1.6;
    }
    .generation-error.show { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .sidebar-backdrop { display: none; }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 9px;
      max-width: min(340px, calc(100vw - 32px));
      padding: 11px 13px;
      border: 1px solid var(--color-border-strong);
      border-radius: 7px;
      background: var(--color-text);
      color: var(--color-bg);
      box-shadow: var(--shadow-menu);
      font-size: 12px;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1060px) {
      .app-shell { grid-template-columns: 210px minmax(0, 1fr); }
      .work-area { grid-template-columns: minmax(470px, 1fr) minmax(340px, 0.8fr); }
      .pane-inner { padding-inline: 22px; }
      .document { width: calc(100% - 28px); padding: 34px 28px 48px; }
      .button-label { display: none; }
      .button { width: 36px; padding: 0; }
      .modal-footer .button { width: auto; padding: 0 12px; }
    }

    @media (max-width: 820px) {
      html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
      body { overflow-y: auto; }
      .app-shell { display: block; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 40;
        width: min(280px, 84vw);
        transform: translateX(-102%);
        transition: transform 200ms ease;
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-backdrop {
        position: fixed;
        inset: 0;
        z-index: 35;
        background: var(--color-overlay);
      }
      .sidebar-backdrop.open { display: block; }
      .tree-actions { display: flex; }
      .workspace { width: 100vw; max-width: 100vw; height: 100vh; grid-template-rows: 58px 42px minmax(0, 1fr); overflow: hidden; }
      .topbar { padding: 0 10px; }
      .icon-button.mobile-menu { display: inline-flex; }
      .project-title { width: min(42vw, 280px); font-size: 13px; }
      .save-state { display: none; }
      .toolbar { gap: 5px; }
      .toolbar > .icon-button:nth-of-type(1) { display: none; }
      .mobile-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-bottom: 1px solid var(--color-border);
        background: var(--color-bg);
      }
      .mobile-tab { border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--color-text-muted); font-size: 11px; font-weight: 600; cursor: pointer; }
      .mobile-tab.active { border-bottom-color: var(--color-accent); color: var(--color-text); }
      .work-area { display: block; width: 100vw; max-width: 100vw; min-height: 0; overflow: hidden; }
      .editor-pane, .preview-pane { width: 100vw; max-width: 100vw; height: 100%; border-right: 0; }
      .preview-pane { display: none; }
      .work-area.show-preview .editor-pane { display: none; }
      .work-area.show-preview .preview-pane { display: block; }
      .pane-inner, .form-section, .field-grid { width: 100%; max-width: 100%; min-width: 0; }
      .pane-inner { padding: 22px 18px 54px; overflow-x: hidden; }
      .markdown-editor-wrap { padding: 12px; }
      .markdown-editor { padding: 14px; font-size: 12px; }
      .markdown-stats { display: none; }
      .markdown-workspace, .markdown-workspace.chat-collapsed { grid-template-rows: 44px minmax(0, 1fr); }
      .ai-chat-header { padding-inline: 12px; }
      .ai-chat-messages { padding: 10px 12px; }
      .ai-chat-form { padding: 9px 12px 10px; }
      .pane-heading { font-size: 20px; }
      .preview-sticky { min-height: 44px; padding: 0 12px; }
      .document { min-height: calc(100vh - 130px); margin-top: 14px; }
    }

    @media (max-width: 560px) {
      .topbar { gap: 7px; }
      .project-block { gap: 6px; }
      .project-title { width: 36vw; }
      .toolbar .button { display: none; }
      #chatModelStatusText { max-width: 112px; }
      .field-grid, .meta-row { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .pane-inner { padding-inline: 14px; }
      .document { width: calc(100% - 20px); padding: 28px 20px 42px; }
      .doc-title { font-size: 23px; }
      .toast { right: 10px; bottom: 10px; }
      .modal-backdrop { padding: 0; }
      .modal { width: 100%; height: 100%; max-height: none; border: 0; border-radius: 0; }
      .modal.library-modal { width: calc(100% - 28px); height: auto; border: 1px solid var(--color-border-strong); border-radius: 8px; }
      .modal-body { padding: 14px; }
      .modal-footer { padding-inline: 14px; }
      .template-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="产品工作流">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><i data-lucide="command"></i></div>
        <div>
          <div class="brand-name">AI PM 工作台</div>
          <div class="brand-version">PRODUCT OS · 01</div>
        </div>
      </div>
      <nav class="workflow">
        <div class="nav-label">产品工作流</div>
        <ol class="workflow-list">
          <li>
            <button class="workflow-item active" type="button" aria-current="page">
              <span class="workflow-icon"><i data-lucide="file-pen-line"></i></span>
              <span><span class="workflow-name">PRD 制作</span><span class="workflow-desc">定义需求与验收</span></span>
              <span class="step-number">01</span>
            </button>
          </li>
          <li>
            <button class="workflow-item" type="button" disabled>
              <span class="workflow-icon"><i data-lucide="panels-top-left"></i></span>
              <span><span class="workflow-name">原型设计</span><span class="workflow-desc">页面与交互方案</span></span>
              <span class="soon-tag">即将开放</span>
            </button>
          </li>
          <li>
            <button class="workflow-item" type="button" disabled>
              <span class="workflow-icon"><i data-lucide="list-checks"></i></span>
              <span><span class="workflow-name">任务拆解</span><span class="workflow-desc">研发任务与排期</span></span>
              <span class="soon-tag">即将开放</span>
            </button>
          </li>
          <li>
            <button class="workflow-item" type="button" disabled>
              <span class="workflow-icon"><i data-lucide="chart-no-axes-combined"></i></span>
              <span><span class="workflow-name">数据复盘</span><span class="workflow-desc">指标与迭代判断</span></span>
              <span class="soon-tag">即将开放</span>
            </button>
          </li>
        </ol>
      </nav>
      <section class="prd-library" aria-label="PRD 文档库">
        <header class="library-header">
          <span class="library-title">PRD 文档</span>
          <div class="library-actions">
            <button class="tree-icon-button" id="createFolderButton" type="button" aria-label="新建目录" title="新建目录"><i data-lucide="folder-plus"></i></button>
            <button class="tree-icon-button" id="createFileButton" type="button" aria-label="新建 PRD 文件" title="新建 PRD 文件"><i data-lucide="file-plus-2"></i></button>
          </div>
        </header>
        <div class="prd-tree" id="prdTree"></div>
      </section>
      <div class="sidebar-footer">
        <div class="progress-meta"><span>PRD 完成度</span><strong id="progressText">0 / 6</strong></div>
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <header class="topbar">

          <div class="title-wrap">
            <div class="project-title" id="projectTitle">未命名产品需求</div>

          </div>
        </div>

          <button class="icon-button" id="themeToggle" type="button" aria-label="切换明暗主题" title="切换主题"><i data-lucide="sun-moon"></i></button>
          <button class="icon-button" id="modelSettingsButton" type="button" aria-label="模型设置" title="模型设置"><i data-lucide="settings-2"></i></button>
          <button class="button" id="copyButton" type="button"><i data-lucide="copy"></i><span class="button-label">复制 PRD</span></button>
          <button class="icon-button" id="moreButton" type="button" aria-label="更多操作" aria-expanded="false"><i data-lucide="ellipsis"></i></button>
        </div>
        <div class="menu" id="moreMenu">
          <button id="menuModelSettingsButton" type="button"><i data-lucide="settings-2"></i>模型设置</button>
          <div class="menu-divider"></div>
          <button id="menuTemplateButton" type="button"><i data-lucide="layout-template"></i>PRD 模板库</button>
          <button id="menuVersionHistoryButton" type="button"><i data-lucide="history"></i>版本历史</button>
          <button id="menuThemeButton" type="button"><i data-lucide="sun-moon"></i>切换明暗主题</button>
          <div class="menu-divider"></div>

        <button class="mobile-tab active" id="editTab" type="button" role="tab" aria-selected="true">编辑</button>
        <button class="mobile-tab" id="previewTab" type="button" role="tab" aria-selected="false">预览</button>

                <div class="markdown-stats" id="markdownStats">0 行 · 0 字</div>

              <form class="ai-chat-form" id="aiChatForm">

负责人：AI 产品组
版本：MVP · V1.0

## 1. 背景和场景

- 用户与场景：内容创作者在制作社媒图片时，希望将两张人物素材快速合成为一张自然的新图片。
- 当前问题：现有专业修图工具操作复杂，普通用户难以保持主体特征、光线和原图风格一致。
- 触发时机：用户在产品 A 的图片工具中进入功能 A，准备制作新的内容素材。

## 2. 目标

- 用户目标：上传源素材和目标图片后，用户可在 60 秒内获得自然、可下载的处理结果。
- 业务目标：验证功能 A 的使用需求与付费潜力，提升图片工具使用率和结果下载率。
- 非目标：MVP 不支持视频处理、多人批量处理、实时摄像头模式和精细局部编辑。

## 3. 需求范围

- 输入：1 张清晰的源素材；1 张包含单个清晰人物的目标图片。支持 JPG、PNG，单张不超过 10 MB。
- 核心能力：提取源素材中的主体特征并融合到目标图片，同时保持目标姿态、光线和背景风格。
- 输出：返回 1 张处理结果图；支持对比原图、重新生成和下载 JPG。
- 约束：登录用户可使用；免费用户每日 2 次；生成任务 90 秒超时；上传前确认拥有图片使用权。
- MVP 不包含：视频或 GIF、多人选择、特殊人物模板、处理强度调节、历史作品云同步。

## 4. 流程

- 主流程：进入功能 A → 上传源素材 → 上传目标图片 → 图片校验 → 确认授权并提交 → 生成中 → 查看结果 → 下载或重新生成。

- 失败后的动作：输入问题引导重新上传；生成失败或超时不扣额度并允许重试；连续失败时提供反馈入口。

## 5. 埋点

| 事件 | 触发时机 | 必要属性 |
| --- | --- | --- |
| feature_a_view | 进入功能 A | entry, plan |

| feature_a_result | 结果返回 | status, latency_ms, error_code |
| feature_a_download | 下载结果 | result_id, plan |
| feature_a_retry | 点击重新生成 | last_status, retry_count |

- AI 质量：有效输入生成成功率 ≥ 95%；人工抽检自然度通过率 ≥ 85%；严重异常率 ≤ 3%。
- 性能：P50 完成时延 ≤ 30 秒，P95 ≤ 60 秒；任务超时率 ≤ 2%。
- 业务指标：进入页到提交转化率 ≥ 35%；成功结果下载率 ≥ 40%；7 日复用率 ≥ 15%。
- 风险指标：违规内容按安全策略拦截；有效投诉率 ≤ 0.1%；原始图片和结果按现有隐私政策留存与删除。`;

      { id: "ecommerce", name: "传统电商产品", description: "商品详情、交易转化与性能", content: ECOMMERCE_TEMPLATE }
    ];

    function blankMarkdown() {
      return `# 未命名产品需求

负责人：待补充
版本：MVP

    let workspaceData = loadWorkspace();
    let markdownDraft = getActiveFile().content;
    let state = parseMarkdown(markdownDraft);
    let modelConfig = loadModelConfig();
    let customTemplates = loadCustomTemplates();
    let chatController = null;
    const aiGenerationHistory = new Map();
    const documentHistories = new Map();
    let saveTimer;
    let versionTimer;
    let toastTimer;
    let libraryDialogAction = null;
    let libraryDialogTrigger = null;

    function createId(prefix) {
      return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function createDefaultWorkspace(content) {
      const now = new Date().toISOString();
      const folderId = createId("folder");
      const fileId = createId("file");
      return {
        folders: [{ id: folderId, name: "产品 A", expanded: true }],
        files: [{ id: fileId, folderId, name: "功能 A MVP.md", content, createdAt: now, updatedAt: now, versions: [createVersionRecord(content, "初始版本", now)] }],
        activeFileId: fileId
      };
    }

    function loadWorkspace() {
      try {
        const savedWorkspace = JSON.parse(localStorage.getItem(WORKSPACE_STORAGE_KEY) || "null");
        if (savedWorkspace && Array.isArray(savedWorkspace.folders) && Array.isArray(savedWorkspace.files) && savedWorkspace.files.length) {
          const folders = savedWorkspace.folders
            .filter((folder) => folder && typeof folder.id === "string")
            .map((folder) => ({ id: folder.id, name: String(folder.name || "未命名目录"), expanded: folder.expanded !== false }));
          const folderIds = new Set(folders.map((folder) => folder.id));
          const files = savedWorkspace.files
            .filter((file) => file && typeof file.id === "string")
            .map((file) => {
              const content = typeof file.content === "string" ? file.content : "";
              const createdAt = file.createdAt || new Date().toISOString();
              const versions = Array.isArray(file.versions)
                ? file.versions.filter((version) => version && typeof version.content === "string").slice(0, 20).map((version) => ({
                    id: String(version.id || createId("version")),
                    content: version.content,
                    label: String(version.label || "历史版本"),
                    createdAt: version.createdAt || createdAt
                  }))
                : [];
              return {
                id: file.id,
                folderId: folderIds.has(file.folderId) ? file.folderId : null,
                name: String(file.name || "未命名 PRD.md"),
                content,
                createdAt,
                updatedAt: file.updatedAt || createdAt,
                versions: versions.length ? versions : [createVersionRecord(content, "迁移版本", createdAt)]
              };
            });
          if (files.length) {
            return {
              folders,
              files,
              activeFileId: files.some((file) => file.id === savedWorkspace.activeFileId) ? savedWorkspace.activeFileId : files[0].id
            };
          }
        }
        const legacyMarkdown = localStorage.getItem(MARKDOWN_STORAGE_KEY);
        return createDefaultWorkspace(legacyMarkdown === null ? DEFAULT_MARKDOWN : legacyMarkdown);
      } catch (error) {
        return createDefaultWorkspace(DEFAULT_MARKDOWN);
      }
    }

    function getActiveFile() {
      return workspaceData.files.find((file) => file.id === workspaceData.activeFileId) || workspaceData.files[0];
    }

    function syncDraftToActiveFile() {
      const file = getActiveFile();
      if (!file) return;
      file.content = markdownDraft;
      file.updatedAt = new Date().toISOString();
    }

    function persistWorkspace() {
      syncDraftToActiveFile();
      localStorage.setItem(WORKSPACE_STORAGE_KEY, JSON.stringify(workspaceData));
      localStorage.setItem(MARKDOWN_STORAGE_KEY, markdownDraft);
    }

    function createVersionRecord(content, label, createdAt = new Date().toISOString()) {
      return { id: createId("version"), content, label, createdAt };
    }

    function loadCustomTemplates() {
      try {
        const saved = JSON.parse(localStorage.getItem(TEMPLATE_STORAGE_KEY) || "[]");
        return Array.isArray(saved)
          ? saved.filter((template) => template && typeof template.content === "string").map((template) => ({
              id: String(template.id || createId("template")),
              name: String(template.name || "未命名模板"),
              content: template.content,
              createdAt: template.createdAt || new Date().toISOString()
            }))
          : [];
      } catch (error) {
        return [];
      }
    }

    function persistCustomTemplates() {
      localStorage.setItem(TEMPLATE_STORAGE_KEY, JSON.stringify(customTemplates));
    }

    function getDocumentHistory() {
      const fileId = workspaceData.activeFileId;
      if (!documentHistories.has(fileId)) documentHistories.set(fileId, { undo: [], redo: [], lastRecordedAt: 0 });
      return documentHistories.get(fileId);
    }

    function updateHistoryButtons() {
      const history = getDocumentHistory();
      document.getElementById("undoButton").disabled = history.undo.length === 0;
      document.getElementById("redoButton").disabled = history.redo.length === 0;
    }

    function recordDocumentChange(previous, next, force = false) {
      if (previous === next) return;
      const history = getDocumentHistory();
      const now = Date.now();
      if (force || !history.undo.length || now - history.lastRecordedAt > 700) {
        if (history.undo[history.undo.length - 1] !== previous) history.undo.push(previous);
        if (history.undo.length > 100) history.undo.shift();
      }
      history.redo = [];
      history.lastRecordedAt = now;
      updateHistoryButtons();
    }

    function undoDocumentChange() {
      const history = getDocumentHistory();
      if (!history.undo.length) return;
      const previous = history.undo.pop();
      history.redo.push(markdownDraft);
      history.lastRecordedAt = 0;
      setMarkdownContent(previous, "已撤销", { recordHistory: false });
      updateHistoryButtons();
    }

    function redoDocumentChange() {
      const history = getDocumentHistory();
      if (!history.redo.length) return;
      const next = history.redo.pop();
      history.undo.push(markdownDraft);
      history.lastRecordedAt = 0;
      setMarkdownContent(next, "已重做", { recordHistory: false });
      updateHistoryButtons();
    }

    function addVersionSnapshot(label, content = markdownDraft, force = false) {
      const file = getActiveFile();
      if (!file) return false;
      if (!Array.isArray(file.versions)) file.versions = [];
      if (!force && file.versions[0]?.content === content) return false;
      file.versions.unshift(createVersionRecord(content, label));
      file.versions = file.versions.slice(0, 20);
      persistWorkspace();
      return true;
    }

    function maybeAddAutoVersion() {
      const file = getActiveFile();
      const latest = file?.versions?.[0];
      if (!file || latest?.content === markdownDraft) return;
      const latestTime = latest ? new Date(latest.createdAt).getTime() : 0;
      if (Date.now() - latestTime >= 60000) addVersionSnapshot("自动版本");
    }

    function loadModelConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(MODEL_CONFIG_KEY) || "null");
        return { provider: "openai", ...MODEL_PRESETS.openai, ...(saved || {}) };
      } catch (error) {
        return { provider: "openai", ...MODEL_PRESETS.openai };
      }
    }

    function getModelApiKey() {
      try {
        return sessionStorage.getItem(MODEL_SECRET_KEY) || "";
      } catch (error) {
        return "";
      }
    }

    function canUseLocalModelProxy() {
      return window.location.protocol === "http:" && ["localhost", "127.0.0.1"].includes(window.location.hostname);
    }

    function getModelRequestEndpoint() {
      return canUseLocalModelProxy() ? LOCAL_MODEL_PROXY_ENDPOINT : modelConfig.endpoint;
    }

    function getModelRequestHeaders() {
      const headers = {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${getModelApiKey()}`
      };
      if (canUseLocalModelProxy()) headers["X-Model-Endpoint"] = modelConfig.endpoint;
      return headers;
    }

    function bindMarkdownEditor() {
      const editor = document.getElementById("markdownEditor");
      editor.value = markdownDraft;
      editor.addEventListener("input", () => {
        const next = editor.value;
        recordDocumentChange(markdownDraft, next);
        markdownDraft = next;
        state = parseMarkdown(markdownDraft);
        updateMarkdownStats();
        scheduleSave();
        renderPreview();
        updateProgress();
      });
      editor.addEventListener("keydown", (event) => {
        if (event.key !== "Tab") return;
        event.preventDefault();
        const start = editor.selectionStart;
        editor.setRangeText("  ", start, editor.selectionEnd, "end");
        editor.dispatchEvent(new Event("input", { bubbles: true }));
      });
      updateMarkdownStats();
    }

    function updateMarkdownStats() {
      const lines = markdownDraft ? markdownDraft.split("\n").length : 0;
      document.getElementById("markdownStats").textContent = `${lines} 行 · ${markdownDraft.length} 字`;
    }

    function scheduleSave() {
      const saveState = document.getElementById("saveState");
      saveState.textContent = "正在保存...";
      window.clearTimeout(saveTimer);
      window.clearTimeout(versionTimer);
      saveTimer = window.setTimeout(() => {
        persistWorkspace();
        saveState.textContent = `已保存 · ${new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })}`;
      }, 350);
      versionTimer = window.setTimeout(maybeAddAutoVersion, 1200);
    }

    function textOrEmpty(value) {
      return value && value.trim() ? value.trim() : "待补充";
    }

    function createElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function createTreeIconButton(iconName, label, onClick, danger = false) {
      const button = createElement("button", `tree-icon-button${danger ? " danger" : ""}`);
      button.type = "button";
      button.setAttribute("aria-label", label);
      button.title = label;
      const icon = document.createElement("i");
      icon.setAttribute("data-lucide", iconName);
      button.appendChild(icon);
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        onClick();
      });
      return button;
    }

    function normalizeFileName(name) {
      const clean = String(name || "").trim().replace(/[\\/:*?"<>|]/g, "-");
      if (!clean) return "未命名 PRD.md";
      return /\.md$/i.test(clean) ? clean : `${clean}.md`;
    }

    function refreshActiveDocument() {
      const file = getActiveFile();
      markdownDraft = file?.content || "";
      state = parseMarkdown(markdownDraft);
      document.getElementById("markdownEditor").value = markdownDraft;
      document.getElementById("activeFileName").textContent = file?.name || "未命名 PRD.md";
      updateMarkdownStats();
      renderPreview();
      updateProgress();
      updateUndoButton();
      updateHistoryButtons();
      renderPrdLibrary();
    }

    function activateFile(fileId) {
      if (chatController) {
        showToast("AI 正在生成，请稍后切换文件");
        return;
      }
      if (fileId === workspaceData.activeFileId) return;
      const target = workspaceData.files.find((file) => file.id === fileId);
      if (!target) return;
      window.clearTimeout(saveTimer);
      window.clearTimeout(versionTimer);
      syncDraftToActiveFile();
      workspaceData.activeFileId = target.id;
      refreshActiveDocument();
      persistWorkspace();
      document.getElementById("saveState").textContent = "已保存到本机";
      if (window.innerWidth <= 820) {
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("sidebarBackdrop").classList.remove("open");
      }
    }

    function openLibraryDialog({ title, description = "", inputLabel = "", initialValue = "", confirmLabel = "确认", destructive = false, onConfirm }) {
      libraryDialogTrigger = document.activeElement;
      libraryDialogAction = onConfirm;
      document.getElementById("libraryDialogTitle").textContent = title;
      document.getElementById("libraryDialogDescription").textContent = description;
      document.getElementById("libraryDialogLabel").textContent = inputLabel;
      const field = document.getElementById("libraryDialogField");
      const input = document.getElementById("libraryDialogInput");
      field.classList.toggle("hidden", !inputLabel);
      input.value = initialValue;
      input.required = Boolean(inputLabel);
      const confirmButton = document.getElementById("confirmLibraryDialog");
      confirmButton.textContent = confirmLabel;
      confirmButton.className = `button ${destructive ? "destructive" : "primary"}`;
      setModalOpen("libraryDialog", true);
      window.setTimeout(() => (inputLabel ? input : confirmButton).focus(), 0);
    }

    function closeLibraryDialog() {
      setModalOpen("libraryDialog", false);
      libraryDialogAction = null;
      if (libraryDialogTrigger) libraryDialogTrigger.focus();
    }

    function submitLibraryDialog(event) {
      event.preventDefault();
      const fieldVisible = !document.getElementById("libraryDialogField").classList.contains("hidden");
      const value = document.getElementById("libraryDialogInput").value.trim();
      if (fieldVisible && !value) {
        document.getElementById("libraryDialogInput").focus();
        return;
      }
      const action = libraryDialogAction;
      setModalOpen("libraryDialog", false);
      libraryDialogAction = null;
      if (action) action(value);
    }

    function renameFolder(folder) {
      openLibraryDialog({
        title: "重命名目录",
        inputLabel: "目录名称",
        initialValue: folder.name,
        confirmLabel: "保存",
        onConfirm: (name) => {
          folder.name = name;
          persistWorkspace();
          renderPrdLibrary();
          showToast("目录已重命名");
        }
      });
    }

    function renameFile(file) {
      openLibraryDialog({
        title: "重命名 PRD",
        inputLabel: "文件名称",
        initialValue: file.name.replace(/\.md$/i, ""),
        confirmLabel: "保存",
        onConfirm: (name) => {
          file.name = normalizeFileName(name);
          file.updatedAt = new Date().toISOString();
          persistWorkspace();
          renderPrdLibrary();
          if (file.id === workspaceData.activeFileId) document.getElementById("activeFileName").textContent = file.name;
          showToast("文件已重命名");
        }
      });
    }

    function ensureEditableFile() {
      if (workspaceData.files.length) return;
      const now = new Date().toISOString();
      const content = blankMarkdown();
      const file = { id: createId("file"), folderId: null, name: "未命名 PRD.md", content, createdAt: now, updatedAt: now, versions: [createVersionRecord(content, "初始版本", now)] };
      workspaceData.files.push(file);
      workspaceData.activeFileId = file.id;
    }

    function deleteFile(file) {
      if (chatController) {
        showToast("AI 正在生成，暂时不能删除文件");
        return;
      }
      openLibraryDialog({
        title: "删除 PRD 文件",
        description: `“${file.name}”删除后无法恢复。`,
        confirmLabel: "删除",
        destructive: true,
        onConfirm: () => {
          syncDraftToActiveFile();
          workspaceData.files = workspaceData.files.filter((item) => item.id !== file.id);
          aiGenerationHistory.delete(file.id);
          documentHistories.delete(file.id);
          ensureEditableFile();
          if (!workspaceData.files.some((item) => item.id === workspaceData.activeFileId)) workspaceData.activeFileId = workspaceData.files[0].id;
          refreshActiveDocument();
          persistWorkspace();
          showToast("PRD 文件已删除");
        }
      });
    }

    function deleteFolder(folder) {
      if (chatController) {
        showToast("AI 正在生成，暂时不能删除目录");
        return;
      }
      const files = workspaceData.files.filter((file) => file.folderId === folder.id);
      const detail = files.length ? `，其中 ${files.length} 个 PRD 文件也会一并删除` : "";
      openLibraryDialog({
        title: "删除目录",
        description: `“${folder.name}”${detail}。删除后无法恢复。`,
        confirmLabel: "删除",
        destructive: true,
        onConfirm: () => {
          syncDraftToActiveFile();
          const deletedIds = new Set(files.map((file) => file.id));
          workspaceData.folders = workspaceData.folders.filter((item) => item.id !== folder.id);
          workspaceData.files = workspaceData.files.filter((file) => !deletedIds.has(file.id));
          deletedIds.forEach((id) => {
            aiGenerationHistory.delete(id);
            documentHistories.delete(id);
          });
          ensureEditableFile();
          if (!workspaceData.files.some((file) => file.id === workspaceData.activeFileId)) workspaceData.activeFileId = workspaceData.files[0].id;
          refreshActiveDocument();
          persistWorkspace();
          showToast("目录已删除");
        }
      });
    }

    function createPrdFolder() {
      openLibraryDialog({
        title: "新建目录",
        inputLabel: "目录名称",
        initialValue: "新产品",
        confirmLabel: "创建",
        onConfirm: (name) => {
          workspaceData.folders.push({ id: createId("folder"), name, expanded: true });
          persistWorkspace();
          renderPrdLibrary();
          showToast("目录已创建");
        }
      });
    }

    function createPrdFile(folderId = undefined) {
      if (chatController) {
        showToast("AI 正在生成，请稍后新建文件");
        return;
      }
      const activeFolderId = getActiveFile()?.folderId || null;
      const targetFolderId = folderId === undefined ? activeFolderId : folderId;
      openLibraryDialog({
        title: "新建 PRD 文件",
        inputLabel: "文件名称",
        initialValue: "新功能 PRD",
        confirmLabel: "创建",
        onConfirm: (name) => {
          syncDraftToActiveFile();
          const now = new Date().toISOString();
          const content = blankMarkdown();
          const file = {
            id: createId("file"),
            folderId: workspaceData.folders.some((folder) => folder.id === targetFolderId) ? targetFolderId : null,
            name: normalizeFileName(name),
            content,
            createdAt: now,
            updatedAt: now,
            versions: [createVersionRecord(content, "初始版本", now)]
          };
          workspaceData.files.push(file);
          workspaceData.activeFileId = file.id;
          refreshActiveDocument();
          persistWorkspace();
          document.getElementById("markdownEditor").focus();
          showToast("新 PRD 文件已创建");
        }
      });
    }

    function renderFileRow(file, parent) {
      const row = createElement("div", `tree-row${file.id === workspaceData.activeFileId ? " active" : ""}`);
      row.dataset.fileId = file.id;
      const main = createElement("button", "tree-main");
      main.type = "button";
      main.title = file.name;
      main.setAttribute("aria-current", file.id === workspaceData.activeFileId ? "page" : "false");
      const icon = document.createElement("i");
      icon.setAttribute("data-lucide", "file-text");
      main.append(icon, createElement("span", "tree-name", file.name));
      main.addEventListener("click", () => activateFile(file.id));
      main.addEventListener("dblclick", () => renameFile(file));
      const actions = createElement("div", "tree-actions");
      actions.append(
        createTreeIconButton("pencil", "重命名文件", () => renameFile(file)),
        createTreeIconButton("trash-2", "删除文件", () => deleteFile(file), true)
      );
      row.append(main, actions);
      parent.appendChild(row);
    }

    function renderPrdLibrary() {
      const tree = document.getElementById("prdTree");
      if (!tree) return;
      tree.replaceChildren();
      workspaceData.folders.forEach((folder) => {
        const section = createElement("section", `tree-folder${folder.expanded ? "" : " collapsed"}`);
        const row = createElement("div", "tree-row");
        const main = createElement("button", "tree-main");
        main.type = "button";
        main.setAttribute("aria-expanded", String(folder.expanded));
        const icon = document.createElement("i");
        icon.setAttribute("data-lucide", folder.expanded ? "folder-open" : "folder");
        main.append(icon, createElement("span", "tree-name", folder.name));
        main.addEventListener("click", () => {
          folder.expanded = !folder.expanded;
          persistWorkspace();
          renderPrdLibrary();
        });
        main.addEventListener("dblclick", () => renameFolder(folder));
        const actions = createElement("div", "tree-actions");
        actions.append(
          createTreeIconButton("file-plus-2", "在目录中新建 PRD", () => createPrdFile(folder.id)),
          createTreeIconButton("pencil", "重命名目录", () => renameFolder(folder)),
          createTreeIconButton("trash-2", "删除目录", () => deleteFolder(folder), true)
        );
        row.append(main, actions);
        const filesWrap = createElement("div", "tree-files");
        const files = workspaceData.files.filter((file) => file.folderId === folder.id);
        files.forEach((file) => renderFileRow(file, filesWrap));
        if (!files.length) filesWrap.appendChild(createElement("div", "tree-empty", "暂无 PRD 文件"));
        section.append(row, filesWrap);
        tree.appendChild(section);
      });

      const rootFiles = workspaceData.files.filter((file) => !file.folderId);
      if (rootFiles.length) {
        tree.appendChild(createElement("div", "tree-root-label", "未归档"));
        rootFiles.forEach((file) => renderFileRow(file, tree));
      }
      lucide.createIcons();
    }

    let templateModalTrigger = null;
    let versionModalTrigger = null;

    function formatHistoryTime(value) {
      return new Date(value).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    function applyTemplate(template) {
      closeTemplateModal();
      openLibraryDialog({
        title: "应用 PRD 模板",
        description: `将“${template.name}”应用到当前文件。当前内容会先保存到版本历史。`,
        confirmLabel: "应用模板",
        onConfirm: () => {
          addVersionSnapshot("应用模板前", markdownDraft, true);
          setMarkdownContent(template.content, `已应用“${template.name}”`);
        }
      });
    }

    function createTemplateItem(template, custom = false) {
      const item = createElement("div", "template-item");
      const copy = createElement("div", "template-copy");
      copy.append(
        createElement("div", "template-name", template.name),
        createElement("div", "template-desc", custom ? `创建于 ${formatHistoryTime(template.createdAt)}` : template.description)
      );
      const actions = createElement("div", "template-actions");
      const useButton = createElement("button", "button", "使用");
      useButton.type = "button";
      useButton.addEventListener("click", () => applyTemplate(template));
      actions.appendChild(useButton);
      if (custom) {
        actions.appendChild(createTreeIconButton("trash-2", "删除模板", () => {
          closeTemplateModal();
          openLibraryDialog({
            title: "删除自定义模板",
            description: `“${template.name}”删除后无法恢复，不会影响已创建的 PRD 文件。`,
            confirmLabel: "删除",
            destructive: true,
            onConfirm: () => {
              customTemplates = customTemplates.filter((item) => item.id !== template.id);
              persistCustomTemplates();
              showToast("自定义模板已删除");
            }
          });
        }, true));
      }
      item.append(copy, actions);
      return item;
    }

    function renderTemplateLibrary() {
      const builtinList = document.getElementById("builtinTemplateList");
      const customList = document.getElementById("customTemplateList");
      builtinList.replaceChildren(...BUILTIN_TEMPLATES.map((template) => createTemplateItem(template)));
      customList.replaceChildren();
      if (customTemplates.length) customList.append(...customTemplates.map((template) => createTemplateItem(template, true)));
      else customList.appendChild(createElement("div", "version-empty", "暂无自定义模板"));
      lucide.createIcons();
    }

    function openTemplateModal() {
      templateModalTrigger = document.activeElement;
      closeMoreMenu();
      renderTemplateLibrary();
      setModalOpen("templateModal", true);

    function closeTemplateModal() {
