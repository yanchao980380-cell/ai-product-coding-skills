<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI 产品经理工作台：用六个核心模块快速完成可评审、可开发、可验收的 PRD。">
  <meta name="theme-color" content="#111310">
  <title>AI PM 工作台 · PRD 制作</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root[data-theme="dark"] {
      --color-bg: #111310;
      --color-sidebar: #171916;
      --color-surface: #1d201c;
      --color-surface-strong: #252923;
      --color-input: #151714;
      --color-text: #f2f3ec;
      --color-text-muted: #9da296;
      --color-accent: #b8ed65;
      --color-accent-ink: #17200b;
      --color-secondary: #ff936f;
      --color-border: #343930;
      --color-border-strong: #4b5246;
      --color-danger: #ff7c75;
      --color-success: #8bd450;
      --color-overlay: rgba(4, 5, 4, 0.72);
      --shadow-menu: 0 16px 48px rgba(0, 0, 0, 0.38);
    }

    :root[data-theme="light"] {
      --color-bg: #f5f5ef;
      --color-sidebar: #eceee7;
      --color-surface: #ffffff;
      --color-surface-strong: #e7eadf;
      --color-input: #fbfcf8;
      --color-text: #1c211b;
      --color-text-muted: #62695f;
      --color-accent: #5f861d;
      --color-accent-ink: #ffffff;
      --color-secondary: #c84e2d;
      --color-border: #d1d6ca;
      --color-border-strong: #aeb6a5;
      --color-danger: #bc3832;
      --color-success: #4e7b20;
      --color-overlay: rgba(27, 31, 25, 0.46);
      --shadow-menu: 0 16px 48px rgba(30, 35, 28, 0.16);
    }

    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; }
    html { color-scheme: dark; }
    html[data-theme="light"] { color-scheme: light; }
    body {
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: "Noto Sans SC", sans-serif;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      transition: background 180ms ease, color 180ms ease;
    }
    button, input, textarea { font: inherit; letter-spacing: 0; }
    button { color: inherit; }
    button, a, input, textarea { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }
    button:disabled { cursor: not-allowed; opacity: 0.42; }
    ::selection { background: var(--color-accent); color: var(--color-accent-ink); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--color-border-strong); border-radius: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .app-shell {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      height: 100vh;
      border-right: 1px solid var(--color-border);
      background: var(--color-sidebar);
      overflow: hidden;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 64px;
      padding: 0 18px;
      border-bottom: 1px solid var(--color-border);
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: var(--color-text);
      color: var(--color-bg);
    }
    .brand-name {
      font-family: "Manrope", "Noto Sans SC", sans-serif;
      font-size: 14px;
      font-weight: 700;
    }
    .brand-version {
      color: var(--color-text-muted);
      font-size: 10px;
      font-weight: 600;
    }
    .workflow {
      flex: 1;
      padding: 18px 10px;
      overflow-y: auto;
    }
    .nav-label {
      padding: 0 9px 8px;
      color: var(--color-text-muted);
      font-size: 11px;
      font-weight: 600;
    }
    .workflow-list { display: grid; gap: 4px; list-style: none; padding: 0; }
    .workflow-item {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      width: 100%;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .workflow-item:hover:not(:disabled) { background: var(--color-surface); }
    .workflow-item.active {
      border-color: var(--color-border);
      background: var(--color-surface-strong);
    }
    .workflow-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      color: var(--color-text-muted);
    }
    .workflow-item.active .workflow-icon { color: var(--color-accent); }
    .workflow-name { display: block; font-size: 13px; font-weight: 600; }
    .workflow-desc { display: block; margin-top: 2px; color: var(--color-text-muted); font-size: 10px; }
    .step-number { color: var(--color-text-muted); font-family: "Manrope", sans-serif; font-size: 10px; }
    .soon-tag {
      padding: 2px 5px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      color: var(--color-text-muted);
      font-size: 9px;
    }
    .sidebar-footer {
      padding: 12px 14px 16px;
      border-top: 1px solid var(--color-border);
    }
    .progress-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--color-text-muted); font-size: 11px; }
    .progress-track { height: 4px; margin-top: 9px; overflow: hidden; border-radius: 4px; background: var(--color-border); }
    .progress-fill { width: 0; height: 100%; background: var(--color-accent); transition: width 220ms ease; }

    .workspace { display: grid; grid-template-rows: 64px minmax(0, 1fr); min-width: 0; height: 100vh; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
      padding: 0 18px 0 22px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg);
    }
    .project-block { display: flex; align-items: center; min-width: 0; gap: 12px; }
    .icon-button.mobile-menu { display: none; }
    .title-wrap { min-width: 0; }
    .project-title {
      display: block;
      width: min(360px, 46vw);
      padding: 3px 0;
      color: var(--color-text);
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .save-state { margin-top: 2px; color: var(--color-text-muted); font-size: 10px; }
    .toolbar { display: flex; align-items: center; gap: 7px; }
    .icon-button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 36px;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      background: var(--color-surface);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }
    .icon-button { width: 36px; padding: 0; }
    .button { padding: 0 12px; font-size: 12px; font-weight: 600; }
    .icon-button:hover, .button:hover { border-color: var(--color-border-strong); background: var(--color-surface-strong); }
    .icon-button:active, .button:active { transform: translateY(1px); }
    .button.primary { border-color: var(--color-accent); background: var(--color-accent); color: var(--color-accent-ink); }
    .button.primary:hover { filter: brightness(0.95); }
    .button.danger { color: var(--color-danger); }
    .lucide { width: 16px; height: 16px; stroke-width: 1.8; }

    .mobile-tabs { display: none; }
    .work-area { display: grid; grid-template-columns: minmax(500px, 1.08fr) minmax(390px, 0.92fr); min-height: 0; }
    .editor-pane, .preview-pane { min-width: 0; min-height: 0; overflow-x: hidden; overflow-y: auto; }
    .editor-pane { border-right: 1px solid var(--color-border); }
    .pane-inner { width: min(100%, 780px); margin: 0 auto; padding: 28px 30px 60px; }
    .pane-kicker { color: var(--color-accent); font-size: 11px; font-weight: 700; }
    .pane-heading { margin-top: 6px; font-size: 23px; line-height: 1.3; }
    .pane-lead { max-width: 620px; margin-top: 8px; color: var(--color-text-muted); font-size: 12px; line-height: 1.7; }
    .editor-pane.markdown-mode { overflow: hidden; }
    .markdown-workspace { display: grid; grid-template-rows: 48px minmax(0, 1fr) minmax(250px, 1fr); width: 100%; height: 100%; min-height: 0; }
    .markdown-workspace.chat-collapsed { grid-template-rows: 48px minmax(0, 1fr) 44px; }
    .markdown-editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
    }
    .markdown-file { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; }
    .markdown-file .lucide { color: var(--color-accent); }
    .markdown-stats { color: var(--color-text-muted); font-size: 10px; }
    .markdown-editor-wrap { min-width: 0; min-height: 0; padding: 18px; background: var(--color-bg); }
    .markdown-editor {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 16px 17px;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      background: var(--color-input);
      color: var(--color-text);
      font-family: "Noto Sans SC", sans-serif;
      font-size: 13px;
      line-height: 1.8;
      tab-size: 2;
      resize: none;
      white-space: pre-wrap;
      overflow-wrap: normal;
      transition: border-color 160ms ease, background 160ms ease;
    }
    .markdown-editor:hover { border-color: var(--color-border-strong); }
    .markdown-editor:focus { border-color: var(--color-accent); outline: 0; background: var(--color-surface); }
    .ai-chat {
      display: grid;
      grid-template-rows: 44px minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      border-top: 1px solid var(--color-border-strong);
      background: var(--color-surface);
    }
    .ai-chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 14px 0 18px;
      border-bottom: 1px solid var(--color-border);
    }
    .ai-chat-title { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; }
    .ai-chat-title .lucide { color: var(--color-accent); }
    .ai-chat-actions { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .chat-toggle { width: 32px; height: 32px; background: transparent; }
    .chat-undo { width: 32px; height: 32px; background: transparent; }
    .chat-undo:disabled { opacity: 0.35; cursor: not-allowed; }
    #chatModelStatusText { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-toggle .chat-collapse-icon { display: inline; }
    .chat-toggle .chat-expand-icon { display: none; }
    .chat-collapsed .chat-toggle .chat-collapse-icon { display: none; }
    .chat-collapsed .chat-toggle .chat-expand-icon { display: inline; }
    .chat-collapsed .ai-chat { grid-template-rows: 44px; }
    .chat-collapsed .ai-chat-messages, .chat-collapsed .ai-chat-form { display: none; }
    .ai-chat-messages { display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: 12px 18px; overflow-y: auto; }
    .ai-message {
      width: fit-content;
      max-width: 88%;
      padding: 8px 10px;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      color: var(--color-text-muted);
      font-size: 11px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .ai-message.user { align-self: flex-end; border-color: var(--color-border-strong); background: var(--color-input); color: var(--color-text); }
    .ai-message.assistant { align-self: flex-start; }
    .ai-message.error { border-color: var(--color-danger); color: var(--color-danger); }
    .ai-chat-form { display: grid; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--color-border); }
    .chat-prompt {
      width: 100%;
      height: 70px;
      padding: 9px 42px 9px 10px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: var(--color-input);
      color: var(--color-text);
      font-size: 11px;
      line-height: 1.55;
      resize: none;
    }
    .chat-prompt:focus { border-color: var(--color-accent); outline: 0; background: var(--color-surface); }
    .chat-prompt::placeholder { color: var(--color-text-muted); opacity: 0.7; }
    .chat-composer { position: relative; }
    .chat-submit {
      position: absolute;
      right: 6px;
      bottom: 7px;
      width: 32px;
      height: 32px;
      border: 1px solid var(--color-accent);
      border-radius: 6px;
      background: var(--color-accent);
      color: var(--color-accent-ink);
      cursor: pointer;
    }
    .chat-submit:disabled { cursor: wait; opacity: 0.65; }
    .chat-submit .chat-loader { display: none; }
    .chat-submit.loading .chat-send-icon { display: none; }
    .chat-submit.loading .chat-loader { display: inline; animation: spin 900ms linear infinite; }
    .chat-error { display: none; color: var(--color-danger); font-size: 10px; }
    .chat-error.show { display: block; }

    .meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
    .form-section { padding: 25px 0; border-bottom: 1px solid var(--color-border); scroll-margin-top: 16px; }
    .section-head { display: grid; grid-template-columns: 34px 1fr auto; align-items: start; gap: 10px; margin-bottom: 17px; }
    .section-number {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid var(--color-border-strong);
      border-radius: 6px;
      color: var(--color-text-muted);
      font-family: "Manrope", sans-serif;
      font-size: 11px;
      font-weight: 700;
    }
    .section-title { font-size: 15px; line-height: 1.3; }
    .section-note { margin-top: 3px; color: var(--color-text-muted); font-size: 11px; line-height: 1.5; }
    .complete-dot { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--color-border-strong); transition: background 160ms ease; }
    .form-section.complete .complete-dot { background: var(--color-success); }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: grid; gap: 7px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .field-label { color: var(--color-text-muted); font-size: 11px; font-weight: 600; }
    .field-label .required { color: var(--color-secondary); }
    .text-input, .text-area {
      width: 100%;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      background: var(--color-input);
      color: var(--color-text);
      transition: border-color 160ms ease, background 160ms ease;
    }
    .text-input { height: 40px; padding: 0 11px; }
    .text-area { min-height: 86px; padding: 10px 11px; line-height: 1.65; resize: vertical; }
    .text-input:hover, .text-area:hover { border-color: var(--color-border-strong); }
    .text-input:focus, .text-area:focus { border-color: var(--color-accent); outline: 0; background: var(--color-surface); }
    .text-input::placeholder, .text-area::placeholder { color: var(--color-text-muted); opacity: 0.7; }
    .hint { color: var(--color-text-muted); font-size: 10px; line-height: 1.5; }

    .event-table-wrap { width: 100%; max-width: 100%; min-width: 0; overflow-x: auto; border: 1px solid var(--color-border); border-radius: 7px; }
    .event-table { width: 100%; min-width: 620px; border-collapse: collapse; }
    .event-table th { padding: 9px 10px; background: var(--color-surface); color: var(--color-text-muted); font-size: 10px; text-align: left; }
    .event-table td { padding: 6px; border-top: 1px solid var(--color-border); }
    .event-table input { width: 100%; height: 34px; padding: 0 7px; border: 0; background: transparent; color: var(--color-text); font-size: 11px; }
    .event-table input:focus { outline: 1px solid var(--color-accent); border-radius: 4px; }

    .preview-pane { background: var(--color-surface); }
    .preview-sticky {
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 48px;
      padding: 0 24px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
    }
    .preview-label { display: flex; align-items: center; gap: 8px; color: var(--color-text-muted); font-size: 11px; font-weight: 600; }
    .preview-actions { display: flex; gap: 6px; }
    .preview-actions .icon-button { width: 32px; height: 32px; background: transparent; }
    .preview-fullscreen-button .minimize-icon { display: none; }
    .preview-pane.preview-fullscreen .preview-fullscreen-button .maximize-icon { display: none; }
    .preview-pane.preview-fullscreen .preview-fullscreen-button .minimize-icon { display: inline; }
    body.preview-fullscreen-open { overflow: hidden; }
    .preview-pane.preview-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: block;
      width: 100vw;
      max-width: 100vw;
      height: 100vh;
      overflow-y: auto;
      background: var(--color-surface);
    }
    .preview-pane.preview-fullscreen .preview-sticky { display: flex; }
    .preview-pane.preview-fullscreen .document { width: min(calc(100% - 40px), 920px); min-height: calc(100vh - 92px); }
    .document {
      width: min(calc(100% - 44px), 720px);
      min-height: calc(100vh - 112px);
      margin: 22px auto 44px;
      padding: 42px 44px 56px;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      background: var(--color-bg);
    }
    .doc-label { color: var(--color-secondary); font-size: 10px; font-weight: 700; }
    .doc-title { margin-top: 10px; font-size: 28px; line-height: 1.35; overflow-wrap: anywhere; }
    .doc-meta { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 13px; padding-bottom: 22px; border-bottom: 1px solid var(--color-border); color: var(--color-text-muted); font-size: 10px; }
    .doc-editable {
      border-radius: 3px;
      outline: 1px solid transparent;
      transition: color 140ms ease, background 140ms ease, outline-color 140ms ease;
      cursor: text;
    }
    .doc-editable:hover { outline-color: var(--color-border-strong); }
    .doc-editable:focus { outline-color: var(--color-accent); background: var(--color-input); color: var(--color-text); }
    .doc-title.doc-editable { padding: 2px 4px; margin-left: -4px; }
    .doc-value.doc-editable { display: inline; padding: 1px 3px; }
    .doc-meta .doc-editable { padding: 1px 3px; }
    .doc-section { padding-top: 24px; }
    .doc-section-head { display: flex; align-items: baseline; gap: 9px; }
    .doc-section-index { color: var(--color-accent); font-family: "Manrope", sans-serif; font-size: 11px; font-weight: 700; }
    .doc-section h2 { font-size: 15px; }
    .doc-content { margin-top: 12px; color: var(--color-text); font-size: 12px; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }
    .doc-list { display: grid; gap: 8px; margin-top: 12px; padding: 0; list-style: none; }
    .doc-list li { display: grid; grid-template-columns: 5px 1fr; gap: 9px; color: var(--color-text); font-size: 12px; line-height: 1.7; }
    .doc-list li::before { content: ""; width: 4px; height: 4px; margin-top: 8px; border-radius: 50%; background: var(--color-accent); }
    .doc-term { color: var(--color-text-muted); }
    .doc-empty { color: var(--color-text-muted); font-style: normal; }
    .doc-table { width: 100%; margin-top: 12px; border-collapse: collapse; font-size: 10px; }
    .doc-table th, .doc-table td { padding: 8px; border: 1px solid var(--color-border); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
    .doc-table th { color: var(--color-text-muted); font-weight: 600; }
    .doc-table td.doc-editable:focus { outline-offset: -2px; }

    .menu {
      position: absolute;
      top: 53px;
      right: 18px;
      z-index: 20;
      display: none;
      width: 210px;
      padding: 6px;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      background: var(--color-surface);
      box-shadow: var(--shadow-menu);
    }
    .menu.open { display: grid; }
    .menu button {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      padding: 0 9px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      text-align: left;
      font-size: 12px;
      cursor: pointer;
    }
    .menu button:hover { background: var(--color-surface-strong); }
    .menu-divider { height: 1px; margin: 5px 3px; background: var(--color-border); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--color-overlay);
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(720px, 100%);
      max-height: min(760px, calc(100vh - 40px));
      overflow: hidden;
      border: 1px solid var(--color-border-strong);
      border-radius: 8px;
      background: var(--color-surface);
      box-shadow: var(--shadow-menu);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 58px;
      padding: 0 16px 0 20px;

负责人：AI 产品组
版本：MVP · V1.0

## 1. 背景和场景

- 用户与场景：内容创作者在制作社媒图片时，希望将两张人物素材快速合成为一张自然的新图片。
- 当前问题：现有专业修图工具操作复杂，普通用户难以保持主体特征、光线和原图风格一致。
- 触发时机：用户在产品 A 的图片工具中进入功能 A，准备制作新的内容素材。

## 2. 目标

- 用户目标：上传源素材和目标图片后，用户可在 60 秒内获得自然、可下载的处理结果。
- 业务目标：验证功能 A 的使用需求与付费潜力，提升图片工具使用率和结果下载率。
- 非目标：MVP 不支持视频处理、多人批量处理、实时摄像头模式和精细局部编辑。

## 3. 需求范围

- 输入：1 张清晰的源素材；1 张包含单个清晰人物的目标图片。支持 JPG、PNG，单张不超过 10 MB。
- 核心能力：提取源素材中的主体特征并融合到目标图片，同时保持目标姿态、光线和背景风格。
- 输出：返回 1 张处理结果图；支持对比原图、重新生成和下载 JPG。
- 约束：登录用户可使用；免费用户每日 2 次；生成任务 90 秒超时；上传前确认拥有图片使用权。
- MVP 不包含：视频或 GIF、多人选择、特殊人物模板、处理强度调节、历史作品云同步。

## 4. 流程

- 主流程：进入功能 A → 上传源素材 → 上传目标图片 → 图片校验 → 确认授权并提交 → 生成中 → 查看结果 → 下载或重新生成。
- 异常与空状态：未检测到有效主体、检测到多个主体、图片模糊或过小、格式不支持、内容安全拦截、生成超时或服务异常。
- 失败后的动作：输入问题引导重新上传；生成失败或超时不扣额度并允许重试；连续失败时提供反馈入口。

## 5. 埋点

| 事件 | 触发时机 | 必要属性 |
| --- | --- | --- |
| feature_a_view | 进入功能 A | entry, plan |
| feature_a_submit | 授权后提交生成 | source_type, target_type, plan |
| feature_a_result | 结果返回 | status, latency_ms, error_code |
| feature_a_download | 下载结果 | result_id, plan |
| feature_a_retry | 点击重新生成 | last_status, retry_count |

## 6. 标准和指标

- 功能验收：支持完整上传与生成流程；非法输入有明确提示；生成失败不扣额度且可重试；成功结果可对比和下载。
- AI 质量：有效输入生成成功率 ≥ 95%；人工抽检自然度通过率 ≥ 85%；严重异常率 ≤ 3%。
- 性能：P50 完成时延 ≤ 30 秒，P95 ≤ 60 秒；任务超时率 ≤ 2%。
- 业务指标：进入页到提交转化率 ≥ 35%；成功结果下载率 ≥ 40%；7 日复用率 ≥ 15%。
- 风险指标：违规内容按安全策略拦截；有效投诉率 ≤ 0.1%；原始图片和结果按现有隐私政策留存与删除。`;

    function previewSectionKeyFromHeading(line) {
      const match = line.match(/^##(?!#)\s+(?:\d+\s*[.、)]?\s*)?(.+?)\s*$/);
      if (!match) return "";
      const title = match[1].replace(/[*_`]/g, "").trim();

    }

    function findPreviewSectionRange(lines, sectionKey) {
      let start = -1;
      for (let index = 0; index < lines.length; index += 1) {
        if (previewSectionKeyFromHeading(lines[index]) === sectionKey) {
          start = index;
          break;
        }
      }
      if (start < 0) return null;
      const nextHeading = lines.findIndex((line, index) => index > start && /^##(?!#)\s+/.test(line));
      return { start, end: nextHeading < 0 ? lines.length : nextHeading };
    }

    function updateMarkdownTitle(markdown, value) {
      const title = value || "未命名产品需求";
      if (/^#(?!#)\s+.*$/m.test(markdown)) return markdown.replace(/^#(?!#)\s+.*$/m, `# ${title}`);
      return `# ${title}\n\n${markdown.trim()}`.trim();
    }

    function updateMarkdownMeta(markdown, label, value) {
      const lines = markdown.replace(/\r\n?/g, "\n").split("\n");
      const labelPattern = new RegExp(`^\\s*(?:[-*]\\s*)?(?:\\*\\*)?${label}(?:\\*\\*)?\\s*[：:]`);
      const existing = lines.findIndex((line) => labelPattern.test(line));
      const replacement = `${label}：${value}`;
      if (existing >= 0) lines[existing] = replacement;
      else {
        const titleIndex = lines.findIndex((line) => /^#(?!#)\s+/.test(line));
        const insertAt = titleIndex >= 0 ? titleIndex + 1 : 0;
        lines.splice(insertAt, 0, "", replacement);
      }
      return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
    }

    function updateMarkdownListItem(markdown, sectionKey, label, value) {
      const lines = markdown.replace(/\r\n?/g, "\n").split("\n");
      let range = findPreviewSectionRange(lines, sectionKey);
      if (!range) {
        const section = PREVIEW_SECTIONS[sectionKey];
        lines.push("", `## ${section.index}. ${section.title}`, "");
        range = { start: lines.length - 2, end: lines.length };
      }
      const aliases = (PREVIEW_LABEL_ALIASES[sectionKey]?.[label] || [label]).map(normalizeLabel);
      let itemIndex = -1;
      for (let index = range.start + 1; index < range.end; index += 1) {
        const candidate = lines[index].replace(/^\s*(?:[-*+]\s+|\d+[.)、]\s*)/, "").trim();
        const match = candidate.match(/^(?:\*\*|__)?([^：:]{1,24}?)(?:\*\*|__)?\s*[：:]/);
        if (match && aliases.includes(normalizeLabel(match[1]))) {
          itemIndex = index;
          break;
        }
      }
      const replacement = `- ${label}：${value}`;
      if (itemIndex >= 0) lines[itemIndex] = replacement;
      else lines.splice(range.end, 0, replacement);
      return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
    }

    function updateMarkdownAnalytics(markdown, rows) {
      const lines = markdown.replace(/\r\n?/g, "\n").split("\n");
      let range = findPreviewSectionRange(lines, "analytics");
      if (!range) {
        const section = PREVIEW_SECTIONS.analytics;
        lines.push("", `## ${section.index}. ${section.title}`, "");
        range = { start: lines.length - 2, end: lines.length };
      }
      const tableLines = [
        "| 事件 | 触发时机 | 必要属性 |",
        "| --- | --- | --- |",
        ...rows.map((row) => `| ${row.event.replace(/\|/g, "/")} | ${row.trigger.replace(/\|/g, "/")} | ${row.properties.replace(/\|/g, "/")} |`)
      ];
      const tableIndexes = [];
      for (let index = range.start + 1; index < range.end; index += 1) {
        if (/^\s*\|.*\|\s*$/.test(lines[index])) tableIndexes.push(index);
      }
      if (tableIndexes.length) lines.splice(tableIndexes[0], tableIndexes[tableIndexes.length - 1] - tableIndexes[0] + 1, ...tableLines);
      else lines.splice(range.end, 0, ...tableLines);
      return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
    }

    function normalizeLabel(value) {
      return value.replace(/[\s/、]/g, "").replace(/[*_`]/g, "").toLowerCase();
    }

    function cleanImportedValue(value) {
      const cleaned = value.replace(/\s{2,}$/gm, "").trim();
      return /^(待补充|tbd|todo)$/i.test(cleaned) ? "" : cleaned;
    }

    function parseLabeledItems(sectionText) {
      const items = new Map();
      let currentLabel = "";
      let currentLines = [];

      function flush() {
        if (currentLabel) items.set(currentLabel, cleanImportedValue(currentLines.join("\n")));
        currentLabel = "";
        currentLines = [];
      }

      sectionText.split("\n").forEach((line) => {
        const withoutBullet = line.replace(/^\s*(?:[-*+]\s+|\d+[.)、]\s*)/, "").trim();
        const match = withoutBullet.match(/^(?:\*\*|__)?([^：:]{1,24}?)(?:\*\*|__)?\s*[：:]\s*(.*)$/);
        if (match) {
          flush();
          currentLabel = normalizeLabel(match[1]);
          currentLines = [match[2].trim()];
        } else if (currentLabel && withoutBullet) {
          currentLines.push(withoutBullet.replace(/[*_`]/g, ""));
        }
      });
      flush();
      return items;
    }

    function getImportedItem(items, aliases) {
      for (const alias of aliases) {
        const value = items.get(normalizeLabel(alias));
        if (value !== undefined) return value;
      }
      return "";
    }

    function plainSectionText(sectionText) {
      return cleanImportedValue(sectionText
        .split("\n")
        .filter((line) => line.trim() && !/^\s*\|/.test(line))
        .map((line) => line.replace(/^\s*(?:[-*+]\s+|\d+[.)、]\s*)/, "").replace(/[*_`]/g, "").trim())
        .join("\n"));
    }

    function parseMarkdownTable(sectionText) {
      return sectionText.split("\n")
        .filter((line) => /^\s*\|.*\|\s*$/.test(line))
        .map((line) => line.trim().slice(1, -1).split("|").map((cell) => cell.trim()
          .replace(/^\*\*(.*?)\*\*$/, "$1")
          .replace(/^__(.*?)__$/, "$1")
          .replace(/^`(.*?)`$/, "$1")))
        .filter((cells) => cells.length >= 3)
        .filter((cells) => !cells.every((cell) => /^:?-{3,}:?$/.test(cell)))
        .filter((cells) => normalizeLabel(cells[0]) !== "事件")
        .map((cells) => ({ event: cleanImportedValue(cells[0]), trigger: cleanImportedValue(cells[1]), properties: cleanImportedValue(cells.slice(2).join(" | ")) }));
    }

    function parseMarkdown(markdown) {
      const source = markdown.replace(/\r\n?/g, "\n").trim();
      const result = blankState();
      const sections = { background: [], goal: [], scope: [], flow: [], analytics: [], standards: [] };
      const headingRules = [
        ["background", /背景(?:和|与)?场景|背景场景/],
        ["scope", /需求范围|功能范围|mvp范围/i],
        ["analytics", /埋点|数据事件|数据埋点/],
        ["standards", /标准(?:和|与)?指标|验收标准|验收(?:和|与)?指标/],
        ["flow", /^(?:用户)?流程$/],
        ["goal", /^目标$/]
      ];
      let currentSection = "";

      source.split("\n").forEach((line) => {
        const heading = line.match(/^#{1,6}\s+(?:\d+\s*[.、]?\s*)?(.+?)\s*$/);
        if (heading) {
          const headingText = heading[1].replace(/[*_`]/g, "").trim();
          const matched = headingRules.find(([, pattern]) => pattern.test(headingText));
          currentSection = matched ? matched[0] : "";
          if (/^#\s+/.test(line) && !matched) result.title = cleanImportedValue(headingText) || result.title;
        } else if (currentSection) {
          sections[currentSection].push(line);
        }
      });

      const ownerMatch = source.match(/(?:^|\n)\s*(?:[-*]\s*)?(?:\*\*)?负责人(?:\*\*)?\s*[：:]\s*([^\n]+)/);
      const versionMatch = source.match(/(?:^|\n)\s*(?:[-*]\s*)?(?:\*\*)?版本(?:\*\*)?\s*[：:]\s*([^\n]+)/);
      result.owner = ownerMatch ? cleanImportedValue(ownerMatch[1]) : "";
      result.version = versionMatch ? cleanImportedValue(versionMatch[1]) : result.version;

      const backgroundText = sections.background.join("\n").trim();
      const backgroundItems = parseLabeledItems(backgroundText);
      result.background.userScenario = getImportedItem(backgroundItems, ["用户与场景", "用户/场景", "用户场景", "场景"]);
      result.background.problem = getImportedItem(backgroundItems, ["当前问题", "用户问题", "问题", "痛点"]);
      result.background.trigger = getImportedItem(backgroundItems, ["触发时机", "触发条件", "时机"]);
      if (!result.background.userScenario && backgroundText) result.background.userScenario = plainSectionText(backgroundText);

      const goalText = sections.goal.join("\n").trim();
      const goalItems = parseLabeledItems(goalText);
      result.goal.userGoal = getImportedItem(goalItems, ["用户目标", "目标"]);
      result.goal.businessGoal = getImportedItem(goalItems, ["业务目标", "商业目标"]);
      result.goal.nonGoal = getImportedItem(goalItems, ["非目标", "不做", "本期不做"]);
      if (!result.goal.userGoal && goalText) result.goal.userGoal = plainSectionText(goalText);

      const scopeText = sections.scope.join("\n").trim();
      const scopeItems = parseLabeledItems(scopeText);
      result.scope.inputs = getImportedItem(scopeItems, ["输入", "用户输入"]);
      result.scope.capability = getImportedItem(scopeItems, ["核心能力", "功能", "能力", "处理"]);
      result.scope.outputs = getImportedItem(scopeItems, ["输出", "结果"]);
      result.scope.constraints = getImportedItem(scopeItems, ["约束", "限制", "规则"]);
      result.scope.outScope = getImportedItem(scopeItems, ["MVP不包含", "不包含", "范围外", "本期不做"]);
      if (!result.scope.capability && scopeText) result.scope.capability = plainSectionText(scopeText);

      const flowText = sections.flow.join("\n").trim();
      const flowItems = parseLabeledItems(flowText);
      result.flow.main = getImportedItem(flowItems, ["主流程", "核心流程", "用户流程", "流程"]);
      result.flow.exceptions = getImportedItem(flowItems, ["异常与空状态", "异常状态", "异常", "空状态"]);
      result.flow.recovery = getImportedItem(flowItems, ["失败后的动作", "失败处理", "恢复方式", "恢复"]);
      if (!result.flow.main && flowText) result.flow.main = plainSectionText(flowText);

      const analyticsRows = parseMarkdownTable(sections.analytics.join("\n"));
      if (analyticsRows.length) result.analytics = analyticsRows;

      const standardsText = sections.standards.join("\n").trim();
      const standardsItems = parseLabeledItems(standardsText);
      result.standards.functional = getImportedItem(standardsItems, ["功能验收", "验收标准", "功能标准"]);
      result.standards.quality = getImportedItem(standardsItems, ["AI质量", "质量", "质量指标"]);
      result.standards.performance = getImportedItem(standardsItems, ["性能", "性能指标"]);
      result.standards.business = getImportedItem(standardsItems, ["业务指标", "业务"]);
      result.standards.risk = getImportedItem(standardsItems, ["风险指标", "风险", "安全指标"]);
      if (!result.standards.functional && standardsText) result.standards.functional = plainSectionText(standardsText);

      return result;
    }

    let settingsModalTrigger = null;

    function setModalOpen(id, open) {
      const modal = document.getElementById(id);
      modal.classList.toggle("open", open);
      modal.setAttribute("aria-hidden", String(!open));
    }

    function closeMoreMenu() {
      document.getElementById("moreMenu").classList.remove("open");
      document.getElementById("moreButton").setAttribute("aria-expanded", "false");
    }

    function updateModelStatus() {
      const configured = Boolean(modelConfig.endpoint && modelConfig.model && getModelApiKey());
      const status = document.getElementById("chatModelStatus");
      status.classList.toggle("configured", configured);
      document.getElementById("chatModelStatusText").textContent = configured
        ? `${MODEL_PRESETS[modelConfig.provider]?.label || "自定义中转站"} · ${modelConfig.model}`
        : "未配置模型";
      document.getElementById("modelSettingsButton").title = configured ? `模型设置：${modelConfig.model}` : "模型设置";
      return configured;
    }

    function toggleAiChat() {
      const workspace = document.getElementById("markdownWorkspace");
      const expanded = workspace.classList.contains("chat-collapsed");
      workspace.classList.toggle("chat-collapsed", !expanded);
      const button = document.getElementById("chatToggle");
      button.setAttribute("aria-expanded", String(expanded));
      button.setAttribute("aria-label", expanded ? "收起 AI 对话" : "展开 AI 对话");
      button.title = expanded ? "收起 AI 对话" : "展开 AI 对话";
      if (expanded) window.setTimeout(() => document.getElementById("chatPrompt").focus(), 0);
    }

    function setChatError(message) {
      const error = document.getElementById("chatError");
      error.textContent = message;
      error.classList.toggle("show", Boolean(message));
    }

    function setSettingsError(message) {
      const error = document.getElementById("settingsError");
      error.textContent = message;
      error.classList.toggle("show", Boolean(message));
    }

    function openModelSettings() {
      settingsModalTrigger = document.activeElement;
      closeMoreMenu();
      document.getElementById("modelProvider").value = modelConfig.provider || "custom";
      document.getElementById("modelEndpoint").value = modelConfig.endpoint || "";
      document.getElementById("modelName").value = modelConfig.model || "";
      document.getElementById("modelApiKey").value = getModelApiKey();
      document.getElementById("modelApiKey").type = "password";
      setSettingsError("");
      setModalOpen("modelSettingsModal", true);
      window.setTimeout(() => document.getElementById("modelProvider").focus(), 0);
    }

    function closeModelSettings() {
      setModalOpen("modelSettingsModal", false);
      if (settingsModalTrigger) settingsModalTrigger.focus();
    }

    function saveModelSettings() {
      const provider = document.getElementById("modelProvider").value;
      const endpoint = document.getElementById("modelEndpoint").value.trim();
      const model = document.getElementById("modelName").value.trim();
      const apiKey = document.getElementById("modelApiKey").value.trim();
      if (!endpoint || !model || !apiKey) {
        setSettingsError("请完整填写接口地址、模型名称和 API Key。");
        return;
      }
      let endpointUrl;
      try {
        endpointUrl = new URL(endpoint);
      } catch (error) {
        setSettingsError("请输入完整、有效的接口地址。");
        return;
      }
      if (!["http:", "https:"].includes(endpointUrl.protocol)) {
        setSettingsError("接口地址仅支持 HTTP 或 HTTPS。");
        return;
      }
      if (provider !== "custom" && endpointUrl.protocol !== "https:") {
        setSettingsError("OpenAI 和 DeepSeek 官方接口必须使用 HTTPS。");
        return;
      }
      modelConfig = { provider, endpoint, model };
      try {
        localStorage.setItem(MODEL_CONFIG_KEY, JSON.stringify(modelConfig));
        sessionStorage.setItem(MODEL_SECRET_KEY, apiKey);
      } catch (error) {
        setSettingsError("浏览器无法保存设置，请检查隐私模式或存储权限。");
        return;
      }
      updateModelStatus();
      const mixedContentRisk = window.location.protocol === "https:" && endpointUrl.protocol === "http:";
      showToast(mixedContentRisk ? "设置已保存；HTTP 请求可能被浏览器拦截" : "模型设置已保存");
      closeModelSettings();
    }

    function buildGenerationMessages(prompt) {
      const systemPrompt = `你是一名资深 AI 产品经理。请把用户输入的产品主题或需求说明整理成超精简、可开发、可验收的中文 PRD。
只输出完整的 Markdown 正文，不要解释，不要使用代码围栏。必须严格包含以下结构和字段：

# 产品需求名称

负责人：待补充
版本：MVP

## 1. 背景和场景
- 用户与场景：
- 当前问题：
- 触发时机：

## 2. 目标
- 用户目标：
- 业务目标：
- 非目标：

## 3. 需求范围
- 输入：
- 核心能力：
- 输出：
- 约束：

## 4. 流程
- 主流程：
- 异常与空状态：

## 5. 埋点
| 事件 | 触发时机 | 必要属性 |
| --- | --- | --- |
| feature_view | 进入功能 | entry |
| feature_submit | 提交任务 | input_type, plan |

      return [

    }

    function updateUndoButton() {
      document.getElementById("chatUndo").disabled = Boolean(chatController) || aiGenerationHistory.length === 0;
    }

    function clearAiHistory() {
      aiGenerationHistory.length = 0;
      updateUndoButton();
    }

    function undoAiGeneration() {
      if (!aiGenerationHistory.length || chatController) return;
      const previousMarkdown = aiGenerationHistory.pop();
      setMarkdownContent(previousMarkdown, "已撤销上次 AI 生成");
      appendChatMessage("assistant", "已恢复生成前的 Markdown。");
      updateUndoButton();
    }

    function setChatBusy(busy) {
      const button = document.getElementById("chatSubmit");
      button.disabled = busy;
      button.classList.toggle("loading", busy);
      document.getElementById("chatModelStatus").disabled = busy;
      document.getElementById("chatPrompt").disabled = busy;
      document.getElementById("chatUndo").disabled = busy || aiGenerationHistory.length === 0;
    }

    function generationErrorMessage(error, status) {
      if (error.name === "AbortError") return "请求已取消或超过 120 秒，请重试。";
      if (status === 401 || status === 403) return "认证失败，请检查 API Key 和模型权限。";
      if (status === 429) return "请求过于频繁或额度不足，请稍后重试。";
      if (status === 400) return error.message || "模型设置不完整，请检查接口地址、模型名称和 API Key。";
      if (status === 502) return error.message || "本机代理无法连接模型接口，请检查地址、网络或代理。";
      if (error instanceof TypeError) return "无法连接模型接口，请检查地址、网络和 CORS 设置。";
      return (error.message || "生成失败，请检查模型设置后重试。").slice(0, 180);
    }

    function appendChatMessage(role, text) {
      const message = document.createElement("div");
      message.className = `ai-message ${role}`;
      message.textContent = text;
      const messages = document.getElementById("chatMessages");
      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;
      return message;
    }

    function focusGeneratedMarkdown() {
      const editor = document.getElementById("markdownEditor");
      editor.focus();
      editor.setSelectionRange(0, 0);
      editor.scrollTop = 0;
    }

    function normalizeGeneratedPrd(markdown) {
      const clean = markdown.trim().replace(/^```(?:markdown)?\s*/i, "").replace(/\s*```$/, "");
      const lines = clean.replace(/\r\n/g, "\n").split("\n");
      const firstTitle = lines.findIndex((line) => /^#(?!#)\s+\S/.test(line));
      return (firstTitle >= 0 ? lines.slice(firstTitle) : lines).join("\n").trim();
    }

    function validateGeneratedPrd(markdown) {
      const expectedHeadings = ["背景和场景", "目标", "需求范围", "流程", "埋点", "标准和指标"];
      const complete = expectedHeadings.every((title) => {
        const escaped = title.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        return new RegExp(`^##\\s*(?:\\d+\\s*[.、)]\\s*)?${escaped}\\s*$`, "m").test(markdown);
      });
      if (!/^#(?!#)\s+\S/m.test(markdown) || !complete) {
        throw new Error("模型返回的 PRD 不完整，请重试。");
      }
    }

    async function generatePrdWithModel(event) {
      event.preventDefault();
      const prompt = document.getElementById("chatPrompt").value.trim();
      if (!prompt) {
        setChatError("请输入产品主题或需求说明。");
        document.getElementById("chatPrompt").focus();
        return;
      }
      if (!updateModelStatus()) {
        setChatError("请先完成模型设置。");
        openModelSettings();
        return;
      }

      setChatError("");
      appendChatMessage("user", prompt);
      const pendingMessage = appendChatMessage("assistant", "正在生成完整 PRD...");
      setChatBusy(true);
      chatController = new AbortController();
      const timeout = window.setTimeout(() => chatController?.abort(), 120000);
      let responseStatus = 0;
      try {
        const response = await fetch(getModelRequestEndpoint(), {
          method: "POST",
          headers: getModelRequestHeaders(),
          body: JSON.stringify({ model: modelConfig.model, messages: buildGenerationMessages(prompt), temperature: 0.2 }),
          signal: chatController.signal
        });
        responseStatus = response.status;
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error?.message || `模型接口返回 ${response.status}`);
        let content = payload.choices?.[0]?.message?.content;
        if (Array.isArray(content)) content = content.map((part) => part.text || "").join("");
        if (typeof content !== "string" || !content.trim()) throw new Error("模型没有返回可用内容。");
        const generatedMarkdown = normalizeGeneratedPrd(content);
        validateGeneratedPrd(generatedMarkdown);
        aiGenerationHistory.push(markdownDraft);
        chatController = null;
        setMarkdownContent(generatedMarkdown, "完整 PRD 已生成");
        pendingMessage.textContent = "完整 PRD 已写入上方 Markdown，可继续编辑或撤销。";
        document.getElementById("chatPrompt").value = "";
        focusGeneratedMarkdown();
        updateUndoButton();
      } catch (error) {
        const message = generationErrorMessage(error, responseStatus);
        pendingMessage.textContent = message;
        pendingMessage.classList.add("error");
        setChatError(message);
      } finally {
        window.clearTimeout(timeout);
        chatController = null;
        setChatBusy(false);
      }
    }

    async function copyMarkdown() {
      try {
        await navigator.clipboard.writeText(buildMarkdown());
        showToast("PRD 已复制为 Markdown");
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = buildMarkdown();
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
        showToast("PRD 已复制为 Markdown");
      }
    }

    function downloadMarkdown() {
      const blob = new Blob([buildMarkdown()], { type: "text/markdown;charset=utf-8" });
      const link = document.createElement("a");
      const safeName = (state.title || "product-requirement").replace(/[\\/:*?"<>|]/g, "-");
      link.href = URL.createObjectURL(blob);
      link.download = `${safeName}.md`;
      link.click();
      URL.revokeObjectURL(link.href);
      showToast("Markdown 文件已下载");
    }

    function setMarkdownContent(markdown, message) {
      markdownDraft = typeof markdown === "string" ? markdown.trim() : "";
      state = parseMarkdown(markdownDraft);
      document.getElementById("markdownEditor").value = markdownDraft;
      updateMarkdownStats();
      renderPreview();
      updateProgress();
      localStorage.setItem(MARKDOWN_STORAGE_KEY, markdownDraft);
      closeMoreMenu();
      showToast(message);
    }

    function showToast(message) {
      document.getElementById("toastText").textContent = message;
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function toggleMobilePreview(showPreview) {
      document.getElementById("workArea").classList.toggle("show-preview", showPreview);
      document.getElementById("editTab").classList.toggle("active", !showPreview);
      document.getElementById("previewTab").classList.toggle("active", showPreview);
      document.getElementById("editTab").setAttribute("aria-selected", String(!showPreview));
      document.getElementById("previewTab").setAttribute("aria-selected", String(showPreview));
    }

    function setPreviewFullscreen(fullscreen) {
      const pane = document.querySelector(".preview-pane");
      pane.classList.toggle("preview-fullscreen", fullscreen);
      document.body.classList.toggle("preview-fullscreen-open", fullscreen);
      const button = document.getElementById("previewFullscreenButton");
      button.setAttribute("aria-label", fullscreen ? "退出全屏预览" : "全屏预览");
      button.title = fullscreen ? "退出全屏预览" : "全屏预览";
    }

    function togglePreviewFullscreen() {
      setPreviewFullscreen(!document.querySelector(".preview-pane").classList.contains("preview-fullscreen"));
    }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem(THEME_KEY, theme);
      document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#111310" : "#f5f5ef";
    }

    document.getElementById("themeToggle").addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
    document.getElementById("menuThemeButton").addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
    document.getElementById("modelSettingsButton").addEventListener("click", openModelSettings);
    document.getElementById("menuModelSettingsButton").addEventListener("click", openModelSettings);
    document.getElementById("chatModelStatus").addEventListener("click", openModelSettings);
    document.getElementById("chatToggle").addEventListener("click", toggleAiChat);
    document.getElementById("chatUndo").addEventListener("click", undoAiGeneration);
    document.getElementById("aiChatForm").addEventListener("submit", generatePrdWithModel);
    document.getElementById("chatPrompt").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        document.getElementById("aiChatForm").requestSubmit();
      }
    });
    document.getElementById("menuExampleButton").addEventListener("click", () => {
      clearAiHistory();
      setMarkdownContent(DEFAULT_MARKDOWN, "已恢复默认脱敏案例");
    });
    document.getElementById("copyButton").addEventListener("click", copyMarkdown);
    document.getElementById("menuCopyButton").addEventListener("click", copyMarkdown);
    document.getElementById("previewCopyButton").addEventListener("click", copyMarkdown);
    document.getElementById("previewFullscreenButton").addEventListener("click", togglePreviewFullscreen);
    document.getElementById("downloadButton").addEventListener("click", downloadMarkdown);
    document.getElementById("previewDownloadButton").addEventListener("click", downloadMarkdown);
    document.getElementById("closeModelSettings").addEventListener("click", closeModelSettings);
    document.getElementById("cancelModelSettings").addEventListener("click", closeModelSettings);
    document.getElementById("saveModelSettings").addEventListener("click", saveModelSettings);
    document.getElementById("modelSettingsModal").addEventListener("click", (event) => {
      if (event.target === event.currentTarget) closeModelSettings();
    });
    document.getElementById("modelProvider").addEventListener("change", (event) => {
      const preset = MODEL_PRESETS[event.target.value];
      document.getElementById("modelEndpoint").value = preset.endpoint;
      document.getElementById("modelName").value = preset.model;
      setSettingsError("");
    });
    document.getElementById("toggleApiKey").addEventListener("click", (event) => {
      const input = document.getElementById("modelApiKey");
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      event.currentTarget.setAttribute("aria-label", show ? "隐藏 API Key" : "显示 API Key");
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (document.getElementById("modelSettingsModal").classList.contains("open")) closeModelSettings();
      else if (document.querySelector(".preview-pane").classList.contains("preview-fullscreen")) setPreviewFullscreen(false);
    });
    document.getElementById("blankButton").addEventListener("click", () => {
      clearAiHistory();
      setMarkdownContent(blankMarkdown(), "已新建空白 PRD");
    });
    document.getElementById("clearButton").addEventListener("click", () => {
      if (window.confirm("确认清空当前 PRD？该操作无法撤销。")) {
        clearAiHistory();
        setMarkdownContent("", "当前 PRD 已清空");
      }
    });
    document.getElementById("moreButton").addEventListener("click", (event) => {
      event.stopPropagation();
      const menu = document.getElementById("moreMenu");
      const open = menu.classList.toggle("open");
      event.currentTarget.setAttribute("aria-expanded", String(open));
    });
    document.addEventListener("click", (event) => {
      const menu = document.getElementById("moreMenu");
      if (!menu.contains(event.target)) {
        closeMoreMenu();
      }
    });
    document.getElementById("mobileMenu").addEventListener("click", () => {
      document.getElementById("sidebar").classList.add("open");
      document.getElementById("sidebarBackdrop").classList.add("open");
    });
    document.getElementById("sidebarBackdrop").addEventListener("click", () => {
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("sidebarBackdrop").classList.remove("open");
    });
    document.getElementById("editTab").addEventListener("click", () => toggleMobilePreview(false));
    document.getElementById("previewTab").addEventListener("click", () => toggleMobilePreview(true));

    applyTheme(localStorage.getItem(THEME_KEY) || "dark");
    bindMarkdownEditor();
    bindPreviewEditor();
    renderPreview();
    updateProgress();
    updateModelStatus();
    lucide.createIcons();
  </script>
