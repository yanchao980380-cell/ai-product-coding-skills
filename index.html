    function makePreviewEditable(element, value, metadata, label) {
      const hasValue = Boolean(value && value.trim());
      element.textContent = hasValue ? value.trim() : "待补充";
      element.classList.add("doc-editable");
      element.classList.toggle("doc-empty", !hasValue);
      element.setAttribute("contenteditable", "plaintext-only");
      element.setAttribute("role", "textbox");
      element.setAttribute("aria-label", label);
      Object.entries(metadata).forEach(([key, data]) => { element.dataset[key] = data; });
      return element;
    }

    function addDocSection(parent, number, title, sectionKey, entries) {
      const section = createElement("section", "doc-section");
      const head = createElement("div", "doc-section-head");
      head.append(createElement("span", "doc-section-index", number), createElement("h2", "", title));
      section.appendChild(head);
      const list = createElement("ul", "doc-list");
      entries.forEach(([label, value]) => {
        const item = createElement("li");
        const content = createElement("div");
        const term = createElement("span", "doc-term", `${label}：`);
        const editable = makePreviewEditable(createElement("span", "doc-value"), value, {
          previewKind: "list",
          previewSection: sectionKey,
          previewLabel: label
        }, `编辑${title}：${label}`);
        content.append(term, editable);
        item.appendChild(content);
        list.appendChild(item);
      });
      section.appendChild(list);
      parent.appendChild(section);
    }

    function createSourceEditable(tag, content, lineIndex, prefix = "", label = "编辑内容") {
      const element = createElement(tag, "doc-source-line", content);
      element.setAttribute("contenteditable", "plaintext-only");
      element.setAttribute("role", "textbox");
      element.setAttribute("aria-label", label);
      element.setAttribute("spellcheck", "false");
      element.dataset.mdLine = String(lineIndex);
      element.dataset.mdPrefix = prefix;
      element.dataset.placeholder = "点击输入内容";
      return element;
    }

    function parseTableCells(line) {
      const trimmed = line.trim().replace(/^\|/, "").replace(/\|$/, "");
      return trimmed.split("|").map((cell) => cell.trim());
    }

    function isTableLine(line) {
      return /^\s*\|.*\|\s*$/.test(line);
    }

    function isTableSeparator(line) {
      const cells = parseTableCells(line);
      return cells.length > 0 && cells.every((cell) => /^:?-{3,}:?$/.test(cell));
    }

    function appendMarkdownTable(doc, lines, startIndex) {
      const table = createElement("table", "doc-table");
      const thead = document.createElement("thead");
      const tbody = document.createElement("tbody");
      let index = startIndex;
      let rowNumber = 0;
      while (index < lines.length && isTableLine(lines[index])) {
        if (isTableSeparator(lines[index])) {
          index += 1;
          continue;
        }
        const row = document.createElement("tr");
        parseTableCells(lines[index]).forEach((cell, columnIndex) => {
          const tag = rowNumber === 0 ? "th" : "td";
          const editable = createSourceEditable(tag, cell, index, "", `编辑表格第 ${rowNumber + 1} 行第 ${columnIndex + 1} 列`);
          editable.dataset.mdTableColumn = String(columnIndex);
          row.appendChild(editable);
        });
        (rowNumber === 0 ? thead : tbody).appendChild(row);
        rowNumber += 1;
        index += 1;
      }
      table.append(thead, tbody);
      doc.appendChild(table);
      return index;
    }

    function renderPreview() {
      const doc = document.getElementById("documentPreview");
      const previousScroll = document.querySelector(".preview-pane").scrollTop;
      doc.replaceChildren();
      document.getElementById("projectTitle").textContent = textOrEmpty(state.title);
      doc.appendChild(createElement("div", "doc-label", "PRODUCT REQUIREMENT DOCUMENT"));
      const lines = markdownDraft.replace(/\r\n?/g, "\n").split("\n");
      let index = 0;
      while (index < lines.length) {
        const line = lines[index];
        if (!line.trim()) {
          if (lines.length === 1) doc.appendChild(createSourceEditable("p", "", 0, "", "编辑段落内容"));
          else doc.appendChild(createElement("div", "doc-source-spacer"));
          index += 1;
          continue;
        }
        if (isTableLine(line) && index + 1 < lines.length && isTableSeparator(lines[index + 1])) {
          index = appendMarkdownTable(doc, lines, index);
          continue;
        }
        const fence = line.match(/^\s*```(.*)$/);
        if (fence) {
          const code = createElement("pre", "doc-code");
          index += 1;
          while (index < lines.length && !/^\s*```/.test(lines[index])) {
            code.appendChild(createSourceEditable("code", lines[index], index, "", "编辑代码内容"));
            index += 1;
          }
          doc.appendChild(code);
          index += index < lines.length ? 1 : 0;
          continue;
        }
        const heading = line.match(/^(#{1,6})\s+(.*)$/);
        if (heading) {
          doc.appendChild(createSourceEditable(`h${heading[1].length}`, heading[2], index, `${heading[1]} `, "编辑标题"));
          index += 1;
          continue;
        }
        const listItem = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (listItem) {
          const row = createElement("div", "doc-list-line");
          row.append(
            createElement("span", "doc-list-marker", /^\d/.test(listItem[2]) ? listItem[2] : "•"),
            createSourceEditable("div", listItem[3], index, `${listItem[1]}${listItem[2]} `, "编辑列表内容")
          );
          doc.appendChild(row);
          index += 1;
          continue;
        }
        const quote = line.match(/^(\s*>\s?)(.*)$/);
        if (quote) {
          const editable = createSourceEditable("blockquote", quote[2], index, quote[1], "编辑引用内容");
          editable.classList.add("doc-quote");
          doc.appendChild(editable);
          index += 1;
          continue;
        }
        if (/^\s*(?:---+|___+|\*\*\*+)\s*$/.test(line)) {
          doc.appendChild(createElement("hr", "doc-divider"));
          index += 1;
          continue;
        }
        doc.appendChild(createSourceEditable("p", line, index, "", "编辑段落内容"));
        index += 1;
      }
      document.querySelector(".preview-pane").scrollTop = previousScroll;
    }

    function previewSectionKeyFromHeading(line) {
      const match = line.match(/^##(?!#)\s+(?:\d+\s*[.、)]?\s*)?(.+?)\s*$/);
      if (!match) return "";
      const title = match[1].replace(/[*_`]/g, "").trim();
      return Object.keys(PREVIEW_SECTIONS).find((key) => PREVIEW_SECTIONS[key].pattern.test(title)) || "";
    }

    function findPreviewSectionRange(lines, sectionKey) {
      let start = -1;
      for (let index = 0; index < lines.length; index += 1) {
        if (previewSectionKeyFromHeading(lines[index]) === sectionKey) {
          start = index;
          break;
        }
      }
      if (start < 0) return null;
      const nextHeading = lines.findIndex((line, index) => index > start && /^##(?!#)\s+/.test(line));
      return { start, end: nextHeading < 0 ? lines.length : nextHeading };
    }

    function updateMarkdownTitle(markdown, value) {
      const title = value || "未命名产品需求";
      if (/^#(?!#)\s+.*$/m.test(markdown)) return markdown.replace(/^#(?!#)\s+.*$/m, `# ${title}`);
      return `# ${title}\n\n${markdown.trim()}`.trim();
    }

    function updateMarkdownMeta(markdown, label, value) {
      const lines = markdown.replace(/\r\n?/g, "\n").split("\n");
      const labelPattern = new RegExp(`^\\s*(?:[-*]\\s*)?(?:\\*\\*)?${label}(?:\\*\\*)?\\s*[：:]`);
      const existing = lines.findIndex((line) => labelPattern.test(line));
      const replacement = `${label}：${value}`;
      if (existing >= 0) lines[existing] = replacement;
      else {
        const titleIndex = lines.findIndex((line) => /^#(?!#)\s+/.test(line));
        const insertAt = titleIndex >= 0 ? titleIndex + 1 : 0;
        lines.splice(insertAt, 0, "", replacement);
      }
      return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
    }

    function updateMarkdownListItem(markdown, sectionKey, label, value) {
      const lines = markdown.replace(/\r\n?/g, "\n").split("\n");
      let range = findPreviewSectionRange(lines, sectionKey);
      if (!range) {
        const section = PREVIEW_SECTIONS[sectionKey];
        lines.push("", `## ${section.index}. ${section.title}`, "");
        range = { start: lines.length - 2, end: lines.length };
      }
      const aliases = (PREVIEW_LABEL_ALIASES[sectionKey]?.[label] || [label]).map(normalizeLabel);
      let itemIndex = -1;
      for (let index = range.start + 1; index < range.end; index += 1) {
        const candidate = lines[index].replace(/^\s*(?:[-*+]\s+|\d+[.)、]\s*)/, "").trim();
        const match = candidate.match(/^(?:\*\*|__)?([^：:]{1,24}?)(?:\*\*|__)?\s*[：:]/);
        if (match && aliases.includes(normalizeLabel(match[1]))) {
          itemIndex = index;
          break;
        }
      }
      const replacement = `- ${label}：${value}`;
      if (itemIndex >= 0) lines[itemIndex] = replacement;
      else lines.splice(range.end, 0, replacement);
      return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
    }

    function updateMarkdownAnalytics(markdown, rows) {
      const lines = markdown.replace(/\r\n?/g, "\n").split("\n");
      let range = findPreviewSectionRange(lines, "analytics");
      if (!range) {
        const section = PREVIEW_SECTIONS.analytics;
        lines.push("", `## ${section.index}. ${section.title}`, "");
        range = { start: lines.length - 2, end: lines.length };
      }
      const tableLines = [
        "| 事件 | 触发时机 | 必要属性 |",
        "| --- | --- | --- |",
        ...rows.map((row) => `| ${row.event.replace(/\|/g, "/")} | ${row.trigger.replace(/\|/g, "/")} | ${row.properties.replace(/\|/g, "/")} |`)
      ];
      const tableIndexes = [];
      for (let index = range.start + 1; index < range.end; index += 1) {
        if (/^\s*\|.*\|\s*$/.test(lines[index])) tableIndexes.push(index);
      }
      if (tableIndexes.length) lines.splice(tableIndexes[0], tableIndexes[tableIndexes.length - 1] - tableIndexes[0] + 1, ...tableLines);
      else lines.splice(range.end, 0, ...tableLines);
      return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
    }

    function previewEditableValue(element) {
      const value = element.textContent.replace(/\s+/g, " ").trim();
      return element.classList.contains("doc-empty") && value === "待补充" ? "" : value;
    }

    function syncPreviewEdit(element) {
      const lineIndex = Number(element.dataset.mdLine);
      if (!Number.isInteger(lineIndex)) return;
      const lines = markdownDraft.replace(/\r\n?/g, "\n").split("\n");
      const value = element.textContent.replace(/\r?\n/g, "");
      if (element.dataset.mdTableColumn !== undefined) {
        const cells = parseTableCells(lines[lineIndex] || "||");
        const columnIndex = Number(element.dataset.mdTableColumn);
        while (cells.length <= columnIndex) cells.push("");
        cells[columnIndex] = value.trim().replace(/\|/g, "/");
        lines[lineIndex] = `| ${cells.join(" | ")} |`;
      } else {
        lines[lineIndex] = `${element.dataset.mdPrefix || ""}${value}`;
      }
      const next = lines.join("\n");
      recordDocumentChange(markdownDraft, next);
      markdownDraft = next;
      state = parseMarkdown(markdownDraft);
      document.getElementById("markdownEditor").value = markdownDraft;
      document.getElementById("projectTitle").textContent = textOrEmpty(state.title);
      updateMarkdownStats();
      scheduleSave();
      updateProgress();
    }

    function bindPreviewEditor() {
      const doc = document.getElementById("documentPreview");
      doc.addEventListener("input", (event) => {
        const editable = event.target.closest(".doc-source-line");
        if (editable) syncPreviewEdit(editable);
      });
      doc.addEventListener("keydown", (event) => {
        if (event.target.closest(".doc-source-line") && event.key === "Enter") {
          event.preventDefault();
          event.target.blur();
        }
      });
    }

    let synchronizedScrollSource = null;

    function syncScrollPosition(source, target) {
      if (synchronizedScrollSource && synchronizedScrollSource !== source) return;
      synchronizedScrollSource = source;
      const sourceRange = source.scrollHeight - source.clientHeight;
      const targetRange = target.scrollHeight - target.clientHeight;
      const progress = sourceRange > 0 ? source.scrollTop / sourceRange : 0;
      target.scrollTop = progress * Math.max(targetRange, 0);
      window.requestAnimationFrame(() => {
        synchronizedScrollSource = null;
      });
    }

    function bindSynchronizedScroll() {
      const editor = document.getElementById("markdownEditor");
      const preview = document.querySelector(".preview-pane");
      editor.addEventListener("scroll", () => syncScrollPosition(editor, preview), { passive: true });
      preview.addEventListener("scroll", () => syncScrollPosition(preview, editor), { passive: true });
    }

    function sectionHasContent(section) {
      if (section === "analytics") return state.analytics.some((row) => row.event.trim() && row.trigger.trim());
      const required = {
        background: [state.background.userScenario],
        goal: [state.goal.userGoal],
        scope: [state.scope.inputs, state.scope.capability],
        flow: [state.flow.main],
        standards: [state.standards.functional]
      };
      return required[section].every((value) => value.trim());
    }

    function updateProgress() {
      const sections = ["background", "goal", "scope", "flow", "analytics", "standards"];
      const complete = sections.filter(sectionHasContent).length;
      document.getElementById("progressText").textContent = `${complete} / 6`;
      document.getElementById("progressFill").style.width = `${(complete / 6) * 100}%`;
    }

    function buildMarkdown() {
      return markdownDraft.trim() ? `${markdownDraft.trim()}\n` : "";
    }

    function normalizeLabel(value) {
      return value.replace(/[\s/、]/g, "").replace(/[*_`]/g, "").toLowerCase();
    }

    function cleanImportedValue(value) {
      const cleaned = value.replace(/\s{2,}$/gm, "").trim();
      return /^(待补充|tbd|todo)$/i.test(cleaned) ? "" : cleaned;
    }

    function parseLabeledItems(sectionText) {
      const items = new Map();
      let currentLabel = "";
      let currentLines = [];

      function flush() {
        if (currentLabel) items.set(currentLabel, cleanImportedValue(currentLines.join("\n")));
        currentLabel = "";
        currentLines = [];
      }

      sectionText.split("\n").forEach((line) => {
        const withoutBullet = line.replace(/^\s*(?:[-*+]\s+|\d+[.)、]\s*)/, "").trim();
        const match = withoutBullet.match(/^(?:\*\*|__)?([^：:]{1,24}?)(?:\*\*|__)?\s*[：:]\s*(.*)$/);
        if (match) {
          flush();
          currentLabel = normalizeLabel(match[1]);
          currentLines = [match[2].trim()];
        } else if (currentLabel && withoutBullet) {
          currentLines.push(withoutBullet.replace(/[*_`]/g, ""));
        }
      });
      flush();
      return items;
    }

    function getImportedItem(items, aliases) {
      for (const alias of aliases) {
        const value = items.get(normalizeLabel(alias));
        if (value !== undefined) return value;
      }
      return "";
    }

    function plainSectionText(sectionText) {
      return cleanImportedValue(sectionText
        .split("\n")
        .filter((line) => line.trim() && !/^\s*\|/.test(line))
        .map((line) => line.replace(/^\s*(?:[-*+]\s+|\d+[.)、]\s*)/, "").replace(/[*_`]/g, "").trim())
        .join("\n"));
    }

    function parseMarkdownTable(sectionText) {
      return sectionText.split("\n")
        .filter((line) => /^\s*\|.*\|\s*$/.test(line))
        .map((line) => line.trim().slice(1, -1).split("|").map((cell) => cell.trim()
          .replace(/^\*\*(.*?)\*\*$/, "$1")
          .replace(/^__(.*?)__$/, "$1")
          .replace(/^`(.*?)`$/, "$1")))
        .filter((cells) => cells.length >= 3)
        .filter((cells) => !cells.every((cell) => /^:?-{3,}:?$/.test(cell)))
        .filter((cells) => normalizeLabel(cells[0]) !== "事件")
        .map((cells) => ({ event: cleanImportedValue(cells[0]), trigger: cleanImportedValue(cells[1]), properties: cleanImportedValue(cells.slice(2).join(" | ")) }));
    }

    function parseMarkdown(markdown) {
      const source = markdown.replace(/\r\n?/g, "\n").trim();
      const result = blankState();
      const sections = { background: [], goal: [], scope: [], flow: [], analytics: [], standards: [] };
      const headingRules = [
        ["background", /背景(?:和|与)?场景|背景场景/],
        ["scope", /需求范围|功能范围|mvp范围/i],
        ["analytics", /埋点|数据事件|数据埋点/],
        ["standards", /标准(?:和|与)?指标|验收标准|验收(?:和|与)?指标/],
        ["flow", /^(?:用户)?流程$/],
        ["goal", /^目标$/]
      ];
      let currentSection = "";

      source.split("\n").forEach((line) => {
        const heading = line.match(/^#{1,6}\s+(?:\d+\s*[.、]?\s*)?(.+?)\s*$/);
        if (heading) {
          const headingText = heading[1].replace(/[*_`]/g, "").trim();
          const matched = headingRules.find(([, pattern]) => pattern.test(headingText));
          currentSection = matched ? matched[0] : "";
          if (/^#\s+/.test(line) && !matched) result.title = cleanImportedValue(headingText) || result.title;
        } else if (currentSection) {
          sections[currentSection].push(line);
        }
      });

      const ownerMatch = source.match(/(?:^|\n)\s*(?:[-*]\s*)?(?:\*\*)?负责人(?:\*\*)?\s*[：:]\s*([^\n]+)/);
      const versionMatch = source.match(/(?:^|\n)\s*(?:[-*]\s*)?(?:\*\*)?版本(?:\*\*)?\s*[：:]\s*([^\n]+)/);
      result.owner = ownerMatch ? cleanImportedValue(ownerMatch[1]) : "";
      result.version = versionMatch ? cleanImportedValue(versionMatch[1]) : result.version;

      const backgroundText = sections.background.join("\n").trim();
      const backgroundItems = parseLabeledItems(backgroundText);
      result.background.userScenario = getImportedItem(backgroundItems, ["用户与场景", "用户/场景", "用户场景", "场景"]);
      result.background.problem = getImportedItem(backgroundItems, ["当前问题", "用户问题", "问题", "痛点"]);
      result.background.trigger = getImportedItem(backgroundItems, ["触发时机", "触发条件", "时机"]);
      if (!result.background.userScenario && backgroundText) result.background.userScenario = plainSectionText(backgroundText);

      const goalText = sections.goal.join("\n").trim();
      const goalItems = parseLabeledItems(goalText);
      result.goal.userGoal = getImportedItem(goalItems, ["用户目标", "目标"]);
      result.goal.businessGoal = getImportedItem(goalItems, ["业务目标", "商业目标"]);
      result.goal.nonGoal = getImportedItem(goalItems, ["非目标", "不做", "本期不做"]);
      if (!result.goal.userGoal && goalText) result.goal.userGoal = plainSectionText(goalText);

      const scopeText = sections.scope.join("\n").trim();
      const scopeItems = parseLabeledItems(scopeText);
      result.scope.inputs = getImportedItem(scopeItems, ["输入", "用户输入"]);
      result.scope.capability = getImportedItem(scopeItems, ["核心能力", "功能", "能力", "处理"]);
      result.scope.outputs = getImportedItem(scopeItems, ["输出", "结果"]);
      result.scope.constraints = getImportedItem(scopeItems, ["约束", "限制", "规则"]);
      result.scope.outScope = getImportedItem(scopeItems, ["MVP不包含", "不包含", "范围外", "本期不做"]);
      if (!result.scope.capability && scopeText) result.scope.capability = plainSectionText(scopeText);

      const flowText = sections.flow.join("\n").trim();
      const flowItems = parseLabeledItems(flowText);
      result.flow.main = getImportedItem(flowItems, ["主流程", "核心流程", "用户流程", "流程"]);
      result.flow.exceptions = getImportedItem(flowItems, ["异常与空状态", "异常状态", "异常", "空状态"]);
      result.flow.recovery = getImportedItem(flowItems, ["失败后的动作", "失败处理", "恢复方式", "恢复"]);
      if (!result.flow.main && flowText) result.flow.main = plainSectionText(flowText);

      const analyticsRows = parseMarkdownTable(sections.analytics.join("\n"));
      if (analyticsRows.length) result.analytics = analyticsRows;

      const standardsText = sections.standards.join("\n").trim();
      const standardsItems = parseLabeledItems(standardsText);
      result.standards.functional = getImportedItem(standardsItems, ["功能验收", "验收标准", "功能标准"]);
      result.standards.quality = getImportedItem(standardsItems, ["AI质量", "质量", "质量指标"]);
      result.standards.performance = getImportedItem(standardsItems, ["性能", "性能指标"]);
      result.standards.business = getImportedItem(standardsItems, ["业务指标", "业务"]);
      result.standards.risk = getImportedItem(standardsItems, ["风险指标", "风险", "安全指标"]);
      if (!result.standards.functional && standardsText) result.standards.functional = plainSectionText(standardsText);

      return result;
    }

    let settingsModalTrigger = null;

    function setModalOpen(id, open) {
      const modal = document.getElementById(id);
      modal.classList.toggle("open", open);
      modal.setAttribute("aria-hidden", String(!open));
    }

    function closeMoreMenu() {
      document.getElementById("moreMenu").classList.remove("open");
      document.getElementById("moreButton").setAttribute("aria-expanded", "false");
    }

    function updateModelStatus() {
      const configured = Boolean(modelConfig.endpoint && modelConfig.model && getModelApiKey());
      const status = document.getElementById("chatModelStatus");
      status.classList.toggle("configured", configured);
      document.getElementById("chatModelStatusText").textContent = configured
        ? `${MODEL_PRESETS[modelConfig.provider]?.label || "自定义中转站"} · ${modelConfig.model}`
        : "未配置模型";
      document.getElementById("modelSettingsButton").title = configured ? `模型设置：${modelConfig.model}` : "模型设置";
      return configured;
    }

    function toggleAiChat() {
      const workspace = document.getElementById("markdownWorkspace");
      const expanded = workspace.classList.contains("chat-collapsed");
      workspace.classList.toggle("chat-collapsed", !expanded);
      const button = document.getElementById("chatToggle");
      button.setAttribute("aria-expanded", String(expanded));
      button.setAttribute("aria-label", expanded ? "收起 AI 对话" : "展开 AI 对话");
      button.title = expanded ? "收起 AI 对话" : "展开 AI 对话";
      if (expanded) window.setTimeout(() => document.getElementById("chatPrompt").focus(), 0);
    }

    function setChatError(message) {
      const error = document.getElementById("chatError");
      error.textContent = message;
      error.classList.toggle("show", Boolean(message));
    }

    function setSettingsError(message) {
      const error = document.getElementById("settingsError");
      error.textContent = message;
      error.classList.toggle("show", Boolean(message));
    }

    function openModelSettings() {
      settingsModalTrigger = document.activeElement;
      closeMoreMenu();
      document.getElementById("modelProvider").value = modelConfig.provider || "custom";
      document.getElementById("modelEndpoint").value = modelConfig.endpoint || "";
      document.getElementById("modelName").value = modelConfig.model || "";
      document.getElementById("modelApiKey").value = getModelApiKey();
      document.getElementById("modelApiKey").type = "password";
      setSettingsError("");
      setModalOpen("modelSettingsModal", true);
      window.setTimeout(() => document.getElementById("modelProvider").focus(), 0);
    }

    function closeModelSettings() {
      setModalOpen("modelSettingsModal", false);
      if (settingsModalTrigger) settingsModalTrigger.focus();
    }

    function saveModelSettings() {
      const provider = document.getElementById("modelProvider").value;
      const endpoint = document.getElementById("modelEndpoint").value.trim();
      const model = document.getElementById("modelName").value.trim();
      const apiKey = document.getElementById("modelApiKey").value.trim();
      if (!endpoint || !model || !apiKey) {
        setSettingsError("请完整填写接口地址、模型名称和 API Key。");
        return;
      }
      let endpointUrl;
      try {
        endpointUrl = new URL(endpoint);
      } catch (error) {
        setSettingsError("请输入完整、有效的接口地址。");
        return;
      }
      if (!["http:", "https:"].includes(endpointUrl.protocol)) {
        setSettingsError("接口地址仅支持 HTTP 或 HTTPS。");
        return;
      }
      if (provider !== "custom" && endpointUrl.protocol !== "https:") {
        setSettingsError("OpenAI 和 DeepSeek 官方接口必须使用 HTTPS。");
        return;
      }
      modelConfig = { provider, endpoint, model };
      try {
        localStorage.setItem(MODEL_CONFIG_KEY, JSON.stringify(modelConfig));
        sessionStorage.setItem(MODEL_SECRET_KEY, apiKey);
      } catch (error) {
        setSettingsError("浏览器无法保存设置，请检查隐私模式或存储权限。");
        return;
      }
      updateModelStatus();
      const mixedContentRisk = window.location.protocol === "https:" && endpointUrl.protocol === "http:";
      showToast(mixedContentRisk ? "设置已保存；HTTP 请求可能被浏览器拦截" : "模型设置已保存");
      closeModelSettings();
    }

    function buildGenerationMessages(prompt) {
      const systemPrompt = `你是一名资深 AI 产品经理。请把用户输入的产品主题或需求说明整理成超精简、可开发、可验收的中文 PRD。
只输出完整的 Markdown 正文，不要解释，不要使用代码围栏。必须严格包含以下结构和字段：

# 产品需求名称

负责人：待补充
版本：MVP

## 1. 背景和场景
- 用户与场景：
- 当前问题：
- 触发时机：

## 2. 目标
- 用户目标：
- 业务目标：
- 非目标：

## 3. 需求范围
- 输入：
- 核心能力：
- 输出：
- 约束：
- MVP 不包含：

## 4. 流程
- 主流程：
- 异常与空状态：
- 失败后的动作：

## 5. 埋点
| 事件 | 触发时机 | 必要属性 |
| --- | --- | --- |
| feature_view | 进入功能 | entry |
| feature_submit | 提交任务 | input_type, plan |
| feature_result | 结果返回 | status, latency_ms |
| feature_export | 使用结果 | export_type |
| feature_error | 任务失败 | error_code, retryable |

## 6. 标准和指标
- 功能验收：

缺失信息可做最小合理假设，并明确标注“假设”。指标尽量使用可衡量阈值；涉及 AI 时考虑输入校验、模型失败、时延、成本或额度、安全与隐私。`;
      return [
        { role: "system", content: systemPrompt },
        { role: "user", content: prompt }
      ];
    }

    function getActiveAiHistory() {
      const fileId = workspaceData.activeFileId;
      if (!aiGenerationHistory.has(fileId)) aiGenerationHistory.set(fileId, []);
      return aiGenerationHistory.get(fileId);
    }

    function updateUndoButton() {
      document.getElementById("chatUndo").disabled = Boolean(chatController) || getActiveAiHistory().length === 0;
    }

    function clearAiHistory() {
      aiGenerationHistory.set(workspaceData.activeFileId, []);
      updateUndoButton();
    }

    function undoAiGeneration() {
      const history = getActiveAiHistory();
      if (!history.length || chatController) return;
      const previousMarkdown = history.pop();
      setMarkdownContent(previousMarkdown, "已撤销上次 AI 生成");
      appendChatMessage("assistant", "已恢复生成前的 Markdown。");
      updateUndoButton();
    }

    function setChatBusy(busy) {
      const button = document.getElementById("chatSubmit");
      button.disabled = busy;
      button.classList.toggle("loading", busy);
      document.getElementById("chatModelStatus").disabled = busy;
      document.getElementById("chatPrompt").disabled = busy;
      document.getElementById("chatUndo").disabled = busy || getActiveAiHistory().length === 0;
    }

    function generationErrorMessage(error, status) {
      if (error.name === "AbortError") return "请求已取消或超过 120 秒，请重试。";
      if (status === 401 || status === 403) return "认证失败，请检查 API Key 和模型权限。";
      if (status === 429) return "请求过于频繁或额度不足，请稍后重试。";
      if (status === 400) return error.message || "模型设置不完整，请检查接口地址、模型名称和 API Key。";
      if (status === 502) return error.message || "本机代理无法连接模型接口，请检查地址、网络或代理。";
      if (error instanceof TypeError) return "无法连接模型接口，请检查地址、网络和 CORS 设置。";
      return (error.message || "生成失败，请检查模型设置后重试。").slice(0, 180);
    }

    function appendChatMessage(role, text) {
      const message = document.createElement("div");
      message.className = `ai-message ${role}`;
      message.textContent = text;
      const messages = document.getElementById("chatMessages");
      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;
      return message;
    }

    function focusGeneratedMarkdown() {
      const editor = document.getElementById("markdownEditor");
      editor.focus();
      editor.setSelectionRange(0, 0);
      editor.scrollTop = 0;
    }

    function normalizeGeneratedPrd(markdown) {
      const clean = markdown.trim().replace(/^```(?:markdown)?\s*/i, "").replace(/\s*```$/, "");
      const lines = clean.replace(/\r\n/g, "\n").split("\n");
      const firstTitle = lines.findIndex((line) => /^#(?!#)\s+\S/.test(line));
      return (firstTitle >= 0 ? lines.slice(firstTitle) : lines).join("\n").trim();
    }

    function validateGeneratedPrd(markdown) {
      const expectedHeadings = ["背景和场景", "目标", "需求范围", "流程", "埋点", "标准和指标"];
      const complete = expectedHeadings.every((title) => {
        const escaped = title.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        return new RegExp(`^##\\s*(?:\\d+\\s*[.、)]\\s*)?${escaped}\\s*$`, "m").test(markdown);
      });
      if (!/^#(?!#)\s+\S/m.test(markdown) || !complete) {
        throw new Error("模型返回的 PRD 不完整，请重试。");
      }
    }

    async function generatePrdWithModel(event) {
      event.preventDefault();
      const prompt = document.getElementById("chatPrompt").value.trim();
      if (!prompt) {
        setChatError("请输入产品主题或需求说明。");
        document.getElementById("chatPrompt").focus();
        return;
      }
      if (!updateModelStatus()) {
        setChatError("请先完成模型设置。");
        openModelSettings();
        return;
      }

      setChatError("");
      appendChatMessage("user", prompt);
      const pendingMessage = appendChatMessage("assistant", "正在生成完整 PRD...");
      setChatBusy(true);
      chatController = new AbortController();
      const timeout = window.setTimeout(() => chatController?.abort(), 120000);
      let responseStatus = 0;
      try {
        const response = await fetch(getModelRequestEndpoint(), {
          method: "POST",
          headers: getModelRequestHeaders(),
          body: JSON.stringify({ model: modelConfig.model, messages: buildGenerationMessages(prompt), temperature: 0.2 }),
          signal: chatController.signal
        });
        responseStatus = response.status;
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error?.message || `模型接口返回 ${response.status}`);
        let content = payload.choices?.[0]?.message?.content;
        if (Array.isArray(content)) content = content.map((part) => part.text || "").join("");
        if (typeof content !== "string" || !content.trim()) throw new Error("模型没有返回可用内容。");
        const generatedMarkdown = normalizeGeneratedPrd(content);
        validateGeneratedPrd(generatedMarkdown);
        getActiveAiHistory().push(markdownDraft);
        chatController = null;
        setMarkdownContent(generatedMarkdown, "完整 PRD 已生成");
        pendingMessage.textContent = "完整 PRD 已写入上方 Markdown，可继续编辑或撤销。";
        document.getElementById("chatPrompt").value = "";
        focusGeneratedMarkdown();
        updateUndoButton();
      } catch (error) {
        const message = generationErrorMessage(error, responseStatus);
        pendingMessage.textContent = message;
        pendingMessage.classList.add("error");
        setChatError(message);
      } finally {
        window.clearTimeout(timeout);
        chatController = null;
        setChatBusy(false);
      }
    }

    async function copyMarkdown() {
      try {
        await navigator.clipboard.writeText(buildMarkdown());
        showToast("PRD 已复制为 Markdown");
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = buildMarkdown();
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
        showToast("PRD 已复制为 Markdown");
      }
    }

    function downloadMarkdown() {
      const blob = new Blob([buildMarkdown()], { type: "text/markdown;charset=utf-8" });
      const link = document.createElement("a");
      const safeName = (state.title || "product-requirement").replace(/[\\/:*?"<>|]/g, "-");
      link.href = URL.createObjectURL(blob);
      link.download = `${safeName}.md`;
      link.click();
      URL.revokeObjectURL(link.href);
      showToast("Markdown 文件已下载");
    }

    function setMarkdownContent(markdown, message, options = {}) {
      const next = typeof markdown === "string" ? markdown.trim() : "";
      if (options.recordHistory !== false) recordDocumentChange(markdownDraft, next, true);
      markdownDraft = next;
      state = parseMarkdown(markdownDraft);
      document.getElementById("markdownEditor").value = markdownDraft;
      updateMarkdownStats();
      renderPreview();
      updateProgress();
      updateHistoryButtons();
      persistWorkspace();
      closeMoreMenu();
      showToast(message);
    }

    function showToast(message) {
      document.getElementById("toastText").textContent = message;
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function toggleMobilePreview(showPreview) {
      document.getElementById("workArea").classList.toggle("show-preview", showPreview);
      document.getElementById("editTab").classList.toggle("active", !showPreview);
      document.getElementById("previewTab").classList.toggle("active", showPreview);
      document.getElementById("editTab").setAttribute("aria-selected", String(!showPreview));
      document.getElementById("previewTab").setAttribute("aria-selected", String(showPreview));
    }

    function setPreviewFullscreen(fullscreen) {
      const pane = document.querySelector(".preview-pane");
      pane.classList.toggle("preview-fullscreen", fullscreen);
      document.body.classList.toggle("preview-fullscreen-open", fullscreen);
      const button = document.getElementById("previewFullscreenButton");
      button.setAttribute("aria-label", fullscreen ? "退出全屏预览" : "全屏预览");
      button.title = fullscreen ? "退出全屏预览" : "全屏预览";
    }

    function togglePreviewFullscreen() {
      setPreviewFullscreen(!document.querySelector(".preview-pane").classList.contains("preview-fullscreen"));
    }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem(THEME_KEY, theme);
      document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#111310" : "#f5f5ef";
    }

    document.getElementById("themeToggle").addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
    document.getElementById("menuThemeButton").addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
    document.getElementById("modelSettingsButton").addEventListener("click", openModelSettings);
    document.getElementById("menuModelSettingsButton").addEventListener("click", openModelSettings);
    document.getElementById("chatModelStatus").addEventListener("click", openModelSettings);
    document.getElementById("chatToggle").addEventListener("click", toggleAiChat);
    document.getElementById("chatUndo").addEventListener("click", undoAiGeneration);
    document.getElementById("aiChatForm").addEventListener("submit", generatePrdWithModel);
    document.getElementById("chatPrompt").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        document.getElementById("aiChatForm").requestSubmit();
      }
    });
    document.getElementById("undoButton").addEventListener("click", undoDocumentChange);
    document.getElementById("redoButton").addEventListener("click", redoDocumentChange);
    document.getElementById("templateLibraryButton").addEventListener("click", openTemplateModal);
    document.getElementById("menuTemplateButton").addEventListener("click", openTemplateModal);
    document.getElementById("versionHistoryButton").addEventListener("click", openVersionHistory);
    document.getElementById("menuVersionHistoryButton").addEventListener("click", openVersionHistory);
    document.getElementById("copyButton").addEventListener("click", copyMarkdown);
    document.getElementById("previewFullscreenButton").addEventListener("click", togglePreviewFullscreen);
    document.getElementById("downloadButton").addEventListener("click", downloadMarkdown);
    document.getElementById("previewDownloadButton").addEventListener("click", downloadMarkdown);
    document.getElementById("closeModelSettings").addEventListener("click", closeModelSettings);
    document.getElementById("cancelModelSettings").addEventListener("click", closeModelSettings);
    document.getElementById("saveModelSettings").addEventListener("click", saveModelSettings);
    document.getElementById("modelSettingsModal").addEventListener("click", (event) => {
      if (event.target === event.currentTarget) closeModelSettings();
    });
    document.getElementById("closeLibraryDialog").addEventListener("click", closeLibraryDialog);
    document.getElementById("cancelLibraryDialog").addEventListener("click", closeLibraryDialog);
    document.getElementById("libraryDialogForm").addEventListener("submit", submitLibraryDialog);
    document.getElementById("libraryDialog").addEventListener("click", (event) => {
      if (event.target === event.currentTarget) closeLibraryDialog();
    });
    document.getElementById("closeTemplateModal").addEventListener("click", closeTemplateModal);
    document.getElementById("cancelTemplateModal").addEventListener("click", closeTemplateModal);
    document.getElementById("saveAsTemplateButton").addEventListener("click", saveCurrentAsTemplate);
    document.getElementById("templateModal").addEventListener("click", (event) => {
      if (event.target === event.currentTarget) closeTemplateModal();
    });
    document.getElementById("closeVersionHistory").addEventListener("click", closeVersionHistory);
    document.getElementById("cancelVersionHistory").addEventListener("click", closeVersionHistory);
    document.getElementById("saveVersionButton").addEventListener("click", saveCurrentVersion);
    document.getElementById("versionHistoryModal").addEventListener("click", (event) => {
      if (event.target === event.currentTarget) closeVersionHistory();
    });
    document.getElementById("modelProvider").addEventListener("change", (event) => {
      const preset = MODEL_PRESETS[event.target.value];
      document.getElementById("modelEndpoint").value = preset.endpoint;
      document.getElementById("modelName").value = preset.model;
      setSettingsError("");
    });
    document.getElementById("toggleApiKey").addEventListener("click", (event) => {
      const input = document.getElementById("modelApiKey");
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      event.currentTarget.setAttribute("aria-label", show ? "隐藏 API Key" : "显示 API Key");
    });
    document.addEventListener("keydown", (event) => {
      const modifier = event.ctrlKey || event.metaKey;
      const editingDocument = event.target.closest?.("#markdownEditor, #documentPreview");
      if (modifier && editingDocument && event.key.toLowerCase() === "z") {
        event.preventDefault();
        if (event.shiftKey) redoDocumentChange();
        else undoDocumentChange();
        return;
      }
      if (modifier && editingDocument && event.key.toLowerCase() === "y") {
        event.preventDefault();
        redoDocumentChange();
        return;
      }
      if (event.key !== "Escape") return;
      if (document.getElementById("libraryDialog").classList.contains("open")) closeLibraryDialog();
      else if (document.getElementById("templateModal").classList.contains("open")) closeTemplateModal();
      else if (document.getElementById("versionHistoryModal").classList.contains("open")) closeVersionHistory();
      else if (document.getElementById("modelSettingsModal").classList.contains("open")) closeModelSettings();
      else if (document.querySelector(".preview-pane").classList.contains("preview-fullscreen")) setPreviewFullscreen(false);
    });
    document.getElementById("blankButton").addEventListener("click", () => {
      closeMoreMenu();
      createPrdFile();
    });
    document.getElementById("clearButton").addEventListener("click", () => {
      closeMoreMenu();
      openLibraryDialog({
        title: "清空当前 PRD",
        description: `“${getActiveFile().name}”的全部内容将被清空，且无法恢复。`,
        confirmLabel: "清空",
        destructive: true,
        onConfirm: () => {
          addVersionSnapshot("清空前备份", markdownDraft, true);
          clearAiHistory();
          setMarkdownContent("", "当前 PRD 已清空");
        }
      });
    });
    document.getElementById("moreButton").addEventListener("click", (event) => {
      event.stopPropagation();
      const menu = document.getElementById("moreMenu");
      const open = menu.classList.toggle("open");
      event.currentTarget.setAttribute("aria-expanded", String(open));
    });
    document.addEventListener("click", (event) => {
      const menu = document.getElementById("moreMenu");
      if (!menu.contains(event.target)) {
        closeMoreMenu();
      }
    });
    document.getElementById("mobileMenu").addEventListener("click", () => {
      document.getElementById("sidebar").classList.add("open");
      document.getElementById("sidebarBackdrop").classList.add("open");
    });
    document.getElementById("sidebarBackdrop").addEventListener("click", () => {
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("sidebarBackdrop").classList.remove("open");
    });
    document.getElementById("editTab").addEventListener("click", () => toggleMobilePreview(false));
    document.getElementById("previewTab").addEventListener("click", () => toggleMobilePreview(true));
    document.getElementById("createFolderButton").addEventListener("click", createPrdFolder);
    document.getElementById("createFileButton").addEventListener("click", () => createPrdFile());

    applyTheme(localStorage.getItem(THEME_KEY) || "dark");
    bindMarkdownEditor();
    bindPreviewEditor();
    bindSynchronizedScroll();
    refreshActiveDocument();
    updateModelStatus();
    lucide.createIcons();
  </script>
